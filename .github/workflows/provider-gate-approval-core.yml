name: Provider Gate Approval Core

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      product_repository:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      state_path:
        required: true
        type: string
      control_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      gate:
        required: true
        type: string
    secrets:
      control_read_token:
        required: true
      product_read_token:
        required: true
      supabase_access_token:
        required: false
      expo_token:
        required: false

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ inputs.project }}
      PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      STATE_PATH: ${{ inputs.state_path }}
      CONTROL_SHA: ${{ inputs.control_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GATE: ${{ inputs.gate }}
    steps:
      - name: Checkout trusted approval workflow
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Checkout exact DEV-CONTROL registration
        uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/DEV-CONTROL
          ref: ${{ inputs.control_sha }}
          path: .approval/control
          token: ${{ secrets.control_read_token }}
          persist-credentials: false

      - name: Checkout exact product source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repository }}
          ref: ${{ inputs.source_sha }}
          path: .approval/product
          token: ${{ secrets.product_read_token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact registered provider gate
        env:
          GH_TOKEN: ${{ secrets.product_read_token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTROL_SHA" = "$(git -C .approval/control rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git -C .approval/product rev-parse HEAD)"
          current="$(gh api "repos/$PRODUCT_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')"
          test "$current" = "$SOURCE_SHA" || {
            echo "::error::Product active branch moved after approval request."
            exit 1
          }

          PROJECT="$PROJECT" GATE="$GATE" STATE_PATH="$STATE_PATH" ruby <<'RUBY'
          require "yaml"

          project = ENV.fetch("PROJECT")
          gate = ENV.fetch("GATE")
          state_path = ENV.fetch("STATE_PATH")

          registry = YAML.safe_load(File.read(".approval/control/PROJECTS.yaml"), aliases: false)
          product = registry.dig("projects", project)
          abort("project is not active") unless product.is_a?(Hash) && product["status"] == "active"
          execution = product["execution"]
          abort("project is not Direct Worker") unless execution.is_a?(Hash) && execution["mode"] == "direct_worker"
          abort("state path mismatch") unless execution["state_path"] == state_path
          provider_gates = execution["provider_gates"]
          config = provider_gates.is_a?(Hash) ? provider_gates[gate] : nil
          abort("provider gate is not registered") unless config.is_a?(Hash)
          abort("provider gate approval mode mismatch") unless config["approval_mode"] == "sanjinworks_owner_button"
          executor = config["executor"]
          abort("provider gate executor is unsupported") unless ["approval_only", "classmo_supabase_migration", "classmo_eas_build", "classmo_eas_update", "wafl_supabase_hardening", "wafl_eas_update"].include?(executor)
          label = config["label"]
          abort("provider gate label missing") unless label.is_a?(String) && !label.strip.empty?

          state = YAML.safe_load(File.read(File.join(".approval/product", state_path)), aliases: false)
          abort("product execution state project mismatch") unless state["project"] == project
          action = state["next_action"]
          abort("current product state is not PROVIDER_GATE") unless action.is_a?(Hash) && action["type"] == "PROVIDER_GATE"
          abort("current product gate changed") unless action["gate"] == gate
          abort("provider approval requires no source scope") unless action["source_scope"] == []

          validation_path = product.dig("ci", "validation", "path")
          abort("validation workflow is not registered") unless validation_path.is_a?(String) && validation_path.start_with?(".github/workflows/")

          values = {
            "PROVIDER_EXECUTOR" => executor,
            "VALIDATION_WORKFLOW_FILE" => File.basename(validation_path),
            "PROVIDER_LABEL" => label,
          }

          if executor == "wafl_supabase_hardening"
            abort("WAFL executor routed to another project") unless project == "WAFL"
            abort("WAFL provider gate mismatch") unless gate == "separate_explicit_provider_authority"
          elsif executor == "classmo_supabase_migration"
            abort("CLASSMO executor routed to another project") unless project == "CLASSMO"
            expected = {
              "provider" => "supabase_management_api",
              "project_ref" => "hfclkbqzxiqhcckwknih",
              "migration_name" => "015_course_configuration_ambiguity",
              "migration_path" => "supabase/migrations/20261007001500_015_course_configuration_ambiguity.sql",
              "checksum_path" => "supabase/migrations/SHA256SUMS",
              "runtime_path" => "supabase/tests/course-operations-runtime.sql",
              "cleanup_path" => "supabase/tests/course-operations-cleanup.sql",
              "expected_prior_migration_name" => "014_course_operations_persistence",
            }
            expected.each do |key, value|
              abort("CLASSMO provider executor #{key} mismatch") unless config[key] == value
            end
            values.merge!(
              "SUPABASE_PROJECT_REF" => config["project_ref"],
              "PROVIDER_MIGRATION_NAME" => config["migration_name"],
              "PROVIDER_MIGRATION_PATH" => config["migration_path"],
              "PROVIDER_CHECKSUM_PATH" => config["checksum_path"],
              "PROVIDER_RUNTIME_PATH" => config["runtime_path"],
              "PROVIDER_CLEANUP_PATH" => config["cleanup_path"],
              "PROVIDER_EXPECTED_PRIOR_MIGRATION" => config["expected_prior_migration_name"],
            )
          elsif executor == "classmo_eas_build"
            abort("CLASSMO EAS executor routed to another project") unless project == "CLASSMO"
            abort("CLASSMO EAS provider gate mismatch") unless gate == "preview_ios_build"
            expected = {
              "provider" => "eas_build",
              "working_directory" => "apps/mobile",
              "platform" => "ios",
              "profile" => "preview",
              "app_version" => "0.0.11",
              "build_number" => "3",
            }
            expected.each do |key, value|
              abort("CLASSMO EAS executor #{key} mismatch") unless config[key] == value
            end
            values.merge!(
              "PROVIDER_WORKING_DIRECTORY" => config["working_directory"],
              "PROVIDER_PLATFORM" => config["platform"],
              "PROVIDER_BUILD_PROFILE" => config["profile"],
              "PROVIDER_APP_VERSION" => config["app_version"],
              "PROVIDER_BUILD_NUMBER" => config["build_number"],
            )
          elsif executor == "classmo_eas_update"
            abort("CLASSMO EAS update executor routed to another project") unless project == "CLASSMO"
            abort("CLASSMO EAS update provider gate mismatch") unless gate == "preview_ios_ota_update"
            expected = {
              "provider" => "eas_update",
              "working_directory" => "apps/mobile",
              "platform" => "ios",
              "environment" => "preview",
              "channel" => "preview",
              "runtime_version" => "0.0.11",
              "compatibility_base_sha" => "bc18af6cab37408643f3825e1137a75dd4b899f3",
            }
            expected.each do |key, value|
              abort("CLASSMO EAS update executor #{key} mismatch") unless config[key] == value
            end
            values.merge!(
              "PROVIDER_WORKING_DIRECTORY" => config["working_directory"],
              "PROVIDER_PLATFORM" => config["platform"],
              "PROVIDER_ENVIRONMENT" => config["environment"],
              "PROVIDER_CHANNEL" => config["channel"],
              "PROVIDER_RUNTIME_VERSION" => config["runtime_version"],
              "PROVIDER_COMPATIBILITY_BASE_SHA" => config["compatibility_base_sha"],
              "PROVIDER_MESSAGE" => "#{label} #{ENV.fetch('SOURCE_SHA')[0,12]}",
            )
          end
          elsif executor == "wafl_eas_update"
            abort("WAFL EAS update executor routed to another project") unless project == "WAFL"
            abort("WAFL EAS update provider gate mismatch") unless gate == "preview_ios_ota_update"
            expected = {
              "provider" => "eas_update",
              "working_directory" => "apps/mobile",
              "platform" => "ios",
              "environment" => "development",
              "channel" => "alpha83-p5",
              "runtime_version" => "2.0.0-alpha.80-p5",
              "compatibility_base_sha" => "bc727f87876949214b9fa29444a5a516909a5ea2",
            }
            expected.each do |key, value|
              abort("WAFL EAS update executor #{key} mismatch") unless config[key] == value
            end
            values.merge!(
              "PROVIDER_WORKING_DIRECTORY" => config["working_directory"],
              "PROVIDER_PLATFORM" => config["platform"],
              "PROVIDER_ENVIRONMENT" => config["environment"],
              "PROVIDER_CHANNEL" => config["channel"],
              "PROVIDER_RUNTIME_VERSION" => config["runtime_version"],
              "PROVIDER_COMPATIBILITY_BASE_SHA" => config["compatibility_base_sha"],
              "PROVIDER_MESSAGE" => "#{label} #{ENV.fetch('SOURCE_SHA')[0,12]}",
              "PROVIDER_APP_VARIANT" => "development",
            )
          end

          File.open(ENV.fetch("GITHUB_ENV"), "a", encoding: "UTF-8") do |env|
            values.each do |key, value|
              abort("unsafe provider environment value") if value.include?("\n") || value.include?("\r")
              env.puts "#{key}=#{value}"
            end
          end

          File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a", encoding: "UTF-8") do |summary|
            summary.puts "## Provider Gate Owner Approval"
            summary.puts
            summary.puts "- project: #{project}"
            summary.puts "- source_sha: #{ENV.fetch('SOURCE_SHA')}"
            summary.puts "- control_sha: #{ENV.fetch('CONTROL_SHA')}"
            summary.puts "- gate: #{gate}"
            summary.puts "- label: #{label}"
            summary.puts "- executor: #{executor}"
            summary.puts "- approval: APPROVED"
          end
          RUBY

      - name: Verify exact integrated source validation and no source writer
        env:
          GH_TOKEN: ${{ secrets.product_read_token }}
        shell: bash
        run: |
          set -euo pipefail
          validation_run="$(gh api             "repos/$PRODUCT_REPOSITORY/actions/workflows/$VALIDATION_WORKFLOW_FILE/runs?head_sha=$SOURCE_SHA&event=push&per_page=20"             --jq '.workflow_runs | map(select(.head_sha == env.SOURCE_SHA and .status == "completed" and .conclusion == "success")) | sort_by(.id) | last | .id // empty')"
          test -n "$validation_run" || {
            echo "::error::Exact current source has no successful integrated validation."
            exit 1
          }
          conflicts="$(gh pr list --repo "$PRODUCT_REPOSITORY" --state open --base "$TARGET_BRANCH"             --json number,headRefName             --jq '.[] | select(.headRefName | startswith("direct/") or startswith("job/")) | "\(.number) \(.headRefName)"')"
          test -z "$conflicts" || {
            echo "::error::Source-writing PR is open; provider execution refuses concurrent mutation."
            echo "$conflicts"
            exit 1
          }
          echo "SOURCE_VALIDATION_RUN_ID=$validation_run" >> "$GITHUB_ENV"
          {
            echo "- source validation run: `$validation_run`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record approval-only boundary
        if: env.PROVIDER_EXECUTOR == 'approval_only'
        shell: bash
        run: |
          {
            echo "- result: `APPROVED`"
            echo "- provider mutation: `NOT_RUN`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Provider gate approval recorded for $PROJECT / $GATE / $SOURCE_SHA."

      - name: WAFL · require scoped Supabase credential
        if: env.PROVIDER_EXECUTOR == 'wafl_supabase_hardening'
        env:
          WAFL_SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WAFL_SUPABASE_ACCESS_TOKEN" || {
            echo "::error::WAFL_SUPABASE_ACCESS_TOKEN is not configured in the trusted Runner repository."
            exit 1
          }

      - name: WAFL · apply Stage-4 hardening and verify provider state
        if: env.PROVIDER_EXECUTOR == 'wafl_supabase_hardening'
        env:
          WAFL_SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wafl_supabase_gate.py \
            --repo "$GITHUB_WORKSPACE/.approval/product" \
            --source-sha "$SOURCE_SHA" \
            --evidence "$RUNNER_TEMP/wafl-provider-evidence.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: WAFL · upload provider evidence
        if: env.PROVIDER_EXECUTOR == 'wafl_supabase_hardening' && success()
        uses: actions/upload-artifact@v4
        with:
          name: wafl-provider-evidence-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/wafl-provider-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: EAS · require scoped Expo credential
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build' || env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        env:
          PROVIDER_EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER_EXPO_TOKEN" || {
            echo "::error::Project-scoped Expo token is not configured in the trusted Runner repository."
            exit 1
          }

      - name: CLASSMO · verify preview build source contract
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(".approval/product") / os.environ["PROVIDER_WORKING_DIRECTORY"]
          app = json.loads((root / "app.json").read_text(encoding="utf-8"))["expo"]
          eas = json.loads((root / "eas.json").read_text(encoding="utf-8"))
          if app.get("version") != os.environ["PROVIDER_APP_VERSION"]:
              raise SystemExit("CLASSMO preview app version mismatch")
          if str(app.get("ios", {}).get("buildNumber")) != os.environ["PROVIDER_BUILD_NUMBER"]:
              raise SystemExit("CLASSMO preview build number mismatch")
          if app.get("runtimeVersion") != {"policy": "appVersion"}:
              raise SystemExit("CLASSMO preview runtimeVersion policy changed")
          preview = eas.get("build", {}).get("preview", {})
          if preview.get("distribution") != "internal" or preview.get("channel") != "preview":
              raise SystemExit("CLASSMO preview EAS profile mismatch")
          if preview.get("ios", {}).get("simulator") is not False:
              raise SystemExit("CLASSMO preview build must target physical iOS devices")
          PY

      - name: EAS · set up EAS CLI
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build' || env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: EAS · install pinned EAS CLI and app dependencies
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build' || env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        env:
          PROVIDER_EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "eas-cli@24.8.0"
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: CLASSMO · build signed internal preview
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          eas build \
            --platform "$PROVIDER_PLATFORM" \
            --profile "$PROVIDER_BUILD_PROFILE" \
            --freeze-credentials \
            --json \
            --non-interactive > "$RUNNER_TEMP/classmo-eas-build.json"
          cd "$GITHUB_WORKSPACE"
          python scripts/provider_action.py parse-eas-build-launch \
            --input "$RUNNER_TEMP/classmo-eas-build.json" \
            --github-env "$GITHUB_ENV"

      - name: CLASSMO · verify signed preview build result
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_build'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EAS_BUILD_ID:-}"
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/classmo-eas-build-view.json"
          cd "$GITHUB_WORKSPACE"
          build_env="$RUNNER_TEMP/classmo-eas-build.env"
          : > "$build_env"
          python scripts/provider_action.py parse-eas-build-view \
            --input "$RUNNER_TEMP/classmo-eas-build-view.json" \
            --expected-id "$EAS_BUILD_ID" \
            --github-env "$build_env"
          set -a
          . "$build_env"
          set +a
          cat "$build_env" >> "$GITHUB_ENV"
          test "$PROVIDER_STATUS" = "SUCCESS"
          test "$EAS_BUILD_APP_VERSION" = "$PROVIDER_APP_VERSION"
          test "$EAS_BUILD_APP_BUILD_VERSION" = "$PROVIDER_BUILD_NUMBER"
          test "$EAS_BUILD_DISTRIBUTION" = "internal"
          {
            echo "## CLASSMO preview iOS build"
            echo
            printf -- '- source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- build ID: `%s`\n' "$EAS_BUILD_ID"
            printf -- '- app/build: `%s (%s)`\n' "$EAS_BUILD_APP_VERSION" "$EAS_BUILD_APP_BUILD_VERSION"
            printf -- '- distribution: `%s`\n' "$EAS_BUILD_DISTRIBUTION"
            echo '- build result: `PASS`'
            echo '- device install / physical QA: `NOT_RUN`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: EAS · verify preview OTA compatibility
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        shell: bash
        run: |
          set -euo pipefail
          git -C .approval/product merge-base --is-ancestor "$PROVIDER_COMPATIBILITY_BASE_SHA" "$SOURCE_SHA"
          python scripts/provider_action.py check-ota \
            --repo "$GITHUB_WORKSPACE/.approval/product" \
            --project CLASSMO \
            --base "$PROVIDER_COMPATIBILITY_BASE_SHA" \
            --head "$SOURCE_SHA" \
            --working-directory "$PROVIDER_WORKING_DIRECTORY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(".approval/product") / os.environ["PROVIDER_WORKING_DIRECTORY"]
          app = json.loads((root / "app.json").read_text(encoding="utf-8"))["expo"]
          if app.get("version") != os.environ["PROVIDER_RUNTIME_VERSION"]:
              raise SystemExit("CLASSMO preview OTA app/runtime version mismatch")
          if app.get("runtimeVersion") != {"policy": "appVersion"}:
              raise SystemExit("CLASSMO preview OTA runtimeVersion policy changed")
          PY

      - name: EAS · publish compatible preview OTA
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          eas update \
            --channel "$PROVIDER_CHANNEL" \
            --environment "$PROVIDER_ENVIRONMENT" \
            --platform "$PROVIDER_PLATFORM" \
            --message "$PROVIDER_MESSAGE" \
            --json \
            --non-interactive > "$RUNNER_TEMP/classmo-eas-update.json"

      - name: EAS · resolve preview OTA group
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          eas update:list \
            --all \
            --platform "$PROVIDER_PLATFORM" \
            --runtime-version "$PROVIDER_RUNTIME_VERSION" \
            --limit 25 \
            --json \
            --non-interactive > "$RUNNER_TEMP/classmo-eas-update-list.json"
          cd "$GITHUB_WORKSPACE"
          update_env="$RUNNER_TEMP/classmo-eas-update.env"
          : > "$update_env"
          python scripts/provider_action.py parse-update-group \
            --input "$RUNNER_TEMP/classmo-eas-update-list.json" \
            --message "$PROVIDER_MESSAGE" \
            --runtime-version "$PROVIDER_RUNTIME_VERSION" \
            --platform "$PROVIDER_PLATFORM" \
            --github-env "$update_env"
          cat "$update_env" >> "$GITHUB_ENV"

      - name: EAS · verify preview OTA platform update
        if: env.PROVIDER_EXECUTOR == 'classmo_eas_update' || env.PROVIDER_EXECUTOR == 'wafl_eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EAS_UPDATE_GROUP_ID:-}"
          cd ".approval/product/$PROVIDER_WORKING_DIRECTORY"
          eas update:view "$EAS_UPDATE_GROUP_ID" --json > "$RUNNER_TEMP/classmo-eas-update-view.json"
          cd "$GITHUB_WORKSPACE"
          update_view_env="$RUNNER_TEMP/classmo-eas-update-view.env"
          : > "$update_view_env"
          python scripts/provider_action.py parse-update-view \
            --input "$RUNNER_TEMP/classmo-eas-update-view.json" \
            --group-id "$EAS_UPDATE_GROUP_ID" \
            --message "$PROVIDER_MESSAGE" \
            --runtime-version "$PROVIDER_RUNTIME_VERSION" \
            --platform "$PROVIDER_PLATFORM" \
            --github-env "$update_view_env"
          set -a
          . "$update_view_env"
          set +a
          cat "$update_view_env" >> "$GITHUB_ENV"
          test -n "$EAS_UPDATE_ID"
          {
            echo "## CLASSMO preview iOS OTA"
            echo
            printf -- '- source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- compatibility baseline: `%s`\n' "$PROVIDER_COMPATIBILITY_BASE_SHA"
            printf -- '- runtime/channel: `%s` / `%s`\n' "$PROVIDER_RUNTIME_VERSION" "$PROVIDER_CHANNEL"
            printf -- '- update group: `%s`\n' "$EAS_UPDATE_GROUP_ID"
            printf -- '- iOS update: `%s`\n' "$EAS_UPDATE_ID"
            echo '- OTA publication: `PASS`'
            echo '- device receipt / physical QA: `NOT_RUN`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLASSMO · require scoped Supabase credential
        if: env.PROVIDER_EXECUTOR == 'classmo_supabase_migration'
        env:
          CLASSMO_SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASSMO_SUPABASE_ACCESS_TOKEN" || {
            echo "::error::CLASSMO_SUPABASE_ACCESS_TOKEN is not configured in the trusted Runner repository."
            exit 1
          }

      - name: CLASSMO · apply migration 015 and verify runtime
        if: env.PROVIDER_EXECUTOR == 'classmo_supabase_migration'
        env:
          CLASSMO_SUPABASE_ACCESS_TOKEN: ${{ secrets.supabase_access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classmo_supabase_gate.py             --repo "$GITHUB_WORKSPACE/.approval/product"             --project-ref "$SUPABASE_PROJECT_REF"             --migration-name "$PROVIDER_MIGRATION_NAME"             --migration-path "$PROVIDER_MIGRATION_PATH"             --checksum-path "$PROVIDER_CHECKSUM_PATH"             --runtime-path "$PROVIDER_RUNTIME_PATH"             --cleanup-path "$PROVIDER_CLEANUP_PATH"             --expected-prior-migration-name "$PROVIDER_EXPECTED_PRIOR_MIGRATION"             --source-sha "$SOURCE_SHA"             --evidence "$RUNNER_TEMP/classmo-provider-evidence.json"             --summary "$GITHUB_STEP_SUMMARY"

      - name: CLASSMO · upload provider evidence
        if: env.PROVIDER_EXECUTOR == 'classmo_supabase_migration' && success()
        uses: actions/upload-artifact@v4
        with:
          name: classmo-provider-evidence-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/classmo-provider-evidence.json
          if-no-files-found: error
          retention-days: 30
