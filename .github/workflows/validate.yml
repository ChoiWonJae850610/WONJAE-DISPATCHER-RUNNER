name: Runner Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Linux isolation security regression (no auth or provider)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ "$current" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          PYTHONPATH=src python scripts/direct_worker_isolation_smoke.py
          mkdir -p "$GITHUB_WORKSPACE/.direct-worker-production-tmp"
          TMPDIR="$GITHUB_WORKSPACE/.direct-worker-production-tmp" \
            PYTHONPATH=src python scripts/direct_worker_isolation_smoke.py
          rm -rf "$GITHUB_WORKSPACE/.direct-worker-production-tmp"
