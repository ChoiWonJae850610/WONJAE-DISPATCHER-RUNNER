name: Runner Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Set up Node for offline dependency integration test
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Ruff
        run: ruff check .

      - name: Tests
        env:
          RUN_NPM_PREPARATION_TESTS: "1"
        run: pytest

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Linux isolation security regression (no auth or provider)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ "$current" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          PYTHONPATH=src python scripts/direct_worker_isolation_smoke.py
          host_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          source_parent="$host_home/.wonjae-direct-worker-source-validation"
          state_parent="$host_home/.wonjae-direct-worker-state-validation"
          production_source="$source_parent/run-$GITHUB_RUN_ID"
          production_state="$state_parent/run-$GITHUB_RUN_ID"
          test "$source_parent" != "$GITHUB_WORKSPACE"
          test "$source_parent" != "$RUNNER_TEMP"
          test "$state_parent" != "$GITHUB_WORKSPACE"
          test "$state_parent" != "$RUNNER_TEMP"
          mkdir -p "$source_parent" "$state_parent"
          test ! -e "$production_source" && test ! -e "$production_state"
          mkdir "$production_source" "$production_state"
          chmod 0500 "$production_source"
          test "$(stat -c '%a' "$production_source")" = "500"
          restore_validation_roots() {
            chmod u+rwx "$GITHUB_WORKSPACE" || true
            chmod -R u+w "$GITHUB_WORKSPACE" || true
            chmod 0700 "$production_source" "$production_state" || true
            rm -rf --one-file-system -- "$production_source" "$production_state"
          }
          trap restore_validation_roots EXIT
          chmod -R a-w "$GITHUB_WORKSPACE"
          chmod a-w "$GITHUB_WORKSPACE"
          test ! -w "$GITHUB_WORKSPACE"
          DIRECT_WORKER_FORBIDDEN_WRITE_ROOT="$production_source" \
            DIRECT_WORKER_FORBIDDEN_STATE_ROOT="$production_state" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python scripts/direct_worker_isolation_smoke.py
          trap - EXIT
          restore_validation_roots
