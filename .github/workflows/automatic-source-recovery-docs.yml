# Explicit Owner-selected historical recovery only; retired Source runs never auto-replay.
name: Direct Worker Failed-Source Recovery Docs
run-name: Recovery Prepare ${{ inputs.project }} run ${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Exact registered product with no source PR
        required: true
        type: choice
        options: [WAFL, CLASSMO, ESC, MUVEL]
      failed_run_id:
        description: Exact completed failed Owner source workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bounded-recovery-docs-${{ inputs.failed_run_id }}
  cancel-in-progress: false

jobs:
  wafl:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.project == 'WAFL' && inputs.failed_run_id != '' }}
    uses: ./.github/workflows/automatic-source-recovery-docs-core.yml
    with:
      project: WAFL
      failed_run_id: ${{ inputs.failed_run_id || '' }}
    secrets:
      product_write_token: ${{ secrets.OWNER_GITHUB_TOKEN }}
      control_read_token: ${{ secrets.OWNER_GITHUB_TOKEN }}

  classmo:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.project == 'CLASSMO' && inputs.failed_run_id != '' }}
    uses: ./.github/workflows/automatic-source-recovery-docs-core.yml
    with:
      project: CLASSMO
      failed_run_id: ${{ inputs.failed_run_id || '' }}
    secrets:
      product_write_token: ${{ secrets.OWNER_GITHUB_TOKEN }}
      control_read_token: ${{ secrets.OWNER_GITHUB_TOKEN }}

  esc:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.project == 'ESC' && inputs.failed_run_id != '' }}
    uses: ./.github/workflows/automatic-source-recovery-docs-core.yml
    with:
      project: ESC
      failed_run_id: ${{ inputs.failed_run_id || '' }}
    secrets:
      product_write_token: ${{ secrets.OWNER_GITHUB_TOKEN }}
      control_read_token: ${{ secrets.OWNER_GITHUB_TOKEN }}

  muvel:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.project == 'MUVEL' && inputs.failed_run_id != '' }}
    uses: ./.github/workflows/automatic-source-recovery-docs-core.yml
    with:
      project: MUVEL
      failed_run_id: ${{ inputs.failed_run_id || '' }}
    secrets:
      product_write_token: ${{ secrets.OWNER_GITHUB_TOKEN }}
      control_read_token: ${{ secrets.OWNER_GITHUB_TOKEN }}
