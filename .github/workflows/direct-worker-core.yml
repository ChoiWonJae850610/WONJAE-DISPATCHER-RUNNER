name: Direct Worker Core

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      command:
        required: true
        type: string
    secrets:
      product_write_token:
        required: true
      control_read_token:
        required: true
      codex_auth_json:
        required: true
      secret_rotation_token:
        required: true

permissions:
  contents: read

concurrency:
  group: direct-worker-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  direct-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runner
        run: python -m pip install -e .

      - name: Checkout current DEV-CONTROL registry
        uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/DEV-CONTROL
          ref: main
          token: ${{ secrets.control_read_token }}
          path: _control
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve registered Direct Worker route
        id: route
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/direct_worker_route.py \
            --registry "$GITHUB_WORKSPACE/_control/PROJECTS.yaml" \
            --project "${{ inputs.project }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve source branch or retry PR
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          TARGET_BRANCH: ${{ steps.route.outputs.branch }}
          PROJECT: ${{ inputs.project }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            next|retry|resume) ;;
            *) echo "::error::Unsupported Direct Worker command."; exit 1 ;;
          esac

          pulls="$(gh api --paginate "repos/$PRODUCT_REPOSITORY/pulls?state=open&base=$TARGET_BRANCH&per_page=100")"
          legacy_count="$(printf '%s' "$pulls" | jq '[.[] | select(.head.ref | startswith("job/"))] | length')"
          direct_count="$(printf '%s' "$pulls" | jq '[.[] | select(.head.ref | startswith("direct/"))] | length')"
          test "$legacy_count" -eq 0 || {
            echo "::error::A legacy Dispatcher product PR is still open for this project."
            exit 1
          }

          if [ "$COMMAND" = "next" ]; then
            test "$direct_count" -eq 0 || {
              echo "::error::An existing Direct Worker PR must be retried/resumed instead of starting another writer."
              exit 1
            }
            echo "source_ref=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
            echo "direct_branch=direct/$PROJECT-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            test "$direct_count" -eq 1 || {
              echo "::error::Retry/resume requires exactly one open Direct Worker PR."
              exit 1
            }
            direct_ref="$(printf '%s' "$pulls" | jq -r '[.[] | select(.head.ref | startswith("direct/"))][0].head.ref')"
            pr_number="$(printf '%s' "$pulls" | jq -r '[.[] | select(.head.ref | startswith("direct/"))][0].number')"
            echo "source_ref=$direct_ref" >> "$GITHUB_OUTPUT"
            echo "direct_branch=$direct_ref" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout product
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.route.outputs.repository }}
          ref: ${{ steps.prepare.outputs.source_ref }}
          token: ${{ secrets.product_write_token }}
          path: _product
          persist-credentials: false
          fetch-depth: 0

      - name: Establish exact starting head
        id: source
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          TARGET_BRANCH: ${{ steps.route.outputs.branch }}
          COMMAND: ${{ inputs.command }}
          DIRECT_BRANCH: ${{ steps.prepare.outputs.direct_branch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_product"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          start_head="$(git rev-parse HEAD)"
          if [ "$COMMAND" = "next" ]; then
            live_head="$(gh api "repos/$PRODUCT_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')"
            test "$start_head" = "$live_head" || {
              echo "::error::Active branch moved during Direct Worker startup."
              exit 1
            }
            git switch -c "$DIRECT_BRANCH"
          fi
          echo "start_head=$start_head" >> "$GITHUB_OUTPUT"
          echo "START_HEAD=$start_head" >> "$GITHUB_ENV"
          echo "DIRECT_BRANCH=$DIRECT_BRANCH" >> "$GITHUB_ENV"
          if [ -n "${{ steps.prepare.outputs.pr_number }}" ]; then
            echo "PR_NUMBER=${{ steps.prepare.outputs.pr_number }}" >> "$GITHUB_ENV"
          fi

      - name: Collect retry validation evidence
        if: ${{ inputs.command == 'retry' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          VALIDATION_WORKFLOW_FILE: ${{ steps.route.outputs.validation_workflow_file }}
        run: |
          set -euo pipefail
          failure_log="$RUNNER_TEMP/direct-worker-validation-failure.log"
          run_id="$(gh api \
            "repos/$PRODUCT_REPOSITORY/actions/workflows/$VALIDATION_WORKFLOW_FILE/runs?head_sha=$START_HEAD&event=pull_request&per_page=20" \
            --jq '.workflow_runs | map(select(.status == "completed" and .conclusion != "success")) | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$run_id" ]; then
            gh run view "$run_id" --repo "$PRODUCT_REPOSITORY" --log-failed > "$failure_log" 2>&1 || true
          fi
          : > /dev/null
          echo "FAILURE_LOG=$failure_log" >> "$GITHUB_ENV"

      - name: Run isolated Codex Direct Worker
        id: codex
        env:
          CODEX_HOME: ${{ runner.temp }}/direct-codex-home
          CODEX_AUTH_JSON: ${{ secrets.codex_auth_json }}
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          result_file="$RUNNER_TEMP/direct-worker-result.json"
          args=(
            --registry "$GITHUB_WORKSPACE/_control/PROJECTS.yaml"
            --project "${{ inputs.project }}"
            --product-checkout "$GITHUB_WORKSPACE/_product"
            --command "${{ inputs.command }}"
            --result-file "$result_file"
          )
          if [ -n "${FAILURE_LOG:-}" ] && [ -s "${FAILURE_LOG:-}" ]; then
            args+=(--failure-log "$FAILURE_LOG")
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/run_direct_worker.py "${args[@]}"
          status="$(jq -r '.status' "$result_file")"
          changed_count="$(jq '.changed_paths | length' "$result_file")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "RESULT_FILE=$result_file" >> "$GITHUB_ENV"
          echo "DIRECT_WORKER_RESULT_BEGIN"
          printf 'status='
          jq -r '.status' "$result_file"
          printf 'summary='
          jq -r '.summary | gsub("[\\r\\n]+"; " ") | .[0:2000]' "$result_file"
          if [ "$status" = "MANUAL_REQUIRED" ]; then
            printf 'manual_action='
            jq -r '.manual_action | gsub("[\\r\\n]+"; " ") | .[0:2000]' "$result_file"
          fi
          echo "DIRECT_WORKER_RESULT_END"

      - name: Rotate refreshed Codex session
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.secret_rotation_token }}
          CODEX_HOME: ${{ runner.temp }}/direct-codex-home
        run: |
          if [ -s "$CODEX_HOME/auth.json" ]; then
            gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
          fi

      - name: Report no-work result
        if: ${{ steps.codex.outputs.status == 'NO_WORK' }}
        run: |
          {
            echo "## Direct Worker"
            echo
            printf -- '- project: `%s`\n' "${{ inputs.project }}"
            printf -- '- command: `%s`\n' "${{ inputs.command }}"
            printf -- '- result: `%s`\n' "NO_WORK"
            echo
            jq -r '.summary' "$RESULT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report manual gate without source mutation
        if: ${{ steps.codex.outputs.status == 'MANUAL_REQUIRED' && steps.codex.outputs.changed_count == '0' }}
        run: |
          {
            echo "## Direct Worker"
            echo
            printf -- '- project: `%s`\n' "${{ inputs.project }}"
            printf -- '- command: `%s`\n' "${{ inputs.command }}"
            printf -- '- result: `%s`\n' "MANUAL_REQUIRED"
            echo
            echo "**Owner action:**"
            jq -r '.manual_action' "$RESULT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Direct Worker reached a real manual gate."
          exit 1

      - name: Commit Direct Worker changes
        if: ${{ steps.codex.outputs.changed_count != '0' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_product"
          test "$(git rev-parse "$START_HEAD")" = "$START_HEAD"
          git diff --check
          git diff --cached --check
          git config user.name "WONJAE Direct Worker"
          git config user.email "direct-worker@users.noreply.github.com"
          git add --all
          git -c core.hooksPath=/dev/null commit \
            -m "[DIRECT][${{ inputs.project }}] ${{ inputs.command }} via SANJINWORKS"
          DIRECT_HEAD="$(git rev-parse HEAD)"
          echo "DIRECT_HEAD=$DIRECT_HEAD" >> "$GITHUB_ENV"

      - name: Push Direct Worker branch
        if: ${{ steps.codex.outputs.changed_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_product"
          git remote set-url origin "https://github.com/$PRODUCT_REPOSITORY.git"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$DIRECT_BRANCH"

      - name: Create or read Direct Worker PR
        if: ${{ steps.codex.outputs.changed_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          TARGET_BRANCH: ${{ steps.route.outputs.branch }}
          PROJECT: ${{ inputs.project }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            body_file="$RUNNER_TEMP/direct-worker-pr.md"
            {
              echo "## Direct Worker"
              echo
              printf -- '- project: `%s`\n' "$PROJECT"
              printf -- '- command: `%s`\n' "$COMMAND"
              printf -- '- source_base_sha: `%s`\n' "$START_HEAD"
              printf -- '- runner_run_id: `%s`\n' "$GITHUB_RUN_ID"
              printf -- '- execution: `%s`\n' "one source writer per project"
              printf -- '- provider/runtime/device: `%s`\n' "NOT_RUN"
            } > "$body_file"
            pr_url="$(gh pr create --repo "$PRODUCT_REPOSITORY" --base "$TARGET_BRANCH" \
              --head "$DIRECT_BRANCH" --title "[DIRECT][$PROJECT] automated next work" \
              --body-file "$body_file")"
            PR_NUMBER="$(gh pr view "$pr_url" --repo "$PRODUCT_REPOSITORY" --json number --jq '.number')"
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          fi
          actual_head="$(gh pr view "$PR_NUMBER" --repo "$PRODUCT_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$actual_head" = "$DIRECT_HEAD" || {
            echo "::error::Direct Worker PR head readback mismatch."
            exit 1
          }

      - name: Preserve manual gate on existing Direct Worker PR
        if: ${{ steps.codex.outputs.status == 'MANUAL_REQUIRED' && steps.codex.outputs.changed_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
        run: |
          result_file="$RUNNER_TEMP/direct-worker-manual.md"
          {
            echo "## Direct Worker result"
            echo
            printf -- '- result: `%s`\n' "MANUAL_REQUIRED"
            printf -- '- runner_run_id: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- head_sha: `%s`\n' "$DIRECT_HEAD"
            echo
            echo "**Owner action:**"
            jq -r '.manual_action' "$RESULT_FILE"
          } > "$result_file"
          gh pr comment "$PR_NUMBER" --repo "$PRODUCT_REPOSITORY" --body-file "$result_file"
          echo "::error::Direct Worker preserved source progress and reached a real manual gate."
          exit 1

      - name: Wait for exact PR-head validation
        if: ${{ steps.codex.outputs.status == 'CHANGED' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          VALIDATION_WORKFLOW_FILE: ${{ steps.route.outputs.validation_workflow_file }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh api \
              "repos/$PRODUCT_REPOSITORY/actions/workflows/$VALIDATION_WORKFLOW_FILE/runs?head_sha=$DIRECT_HEAD&event=pull_request&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id" || { echo "::error::Exact PR-head validation run not found."; exit 1; }
          PR_HEAD_RUN_ID="$run_id"
          echo "PR_HEAD_RUN_ID=$PR_HEAD_RUN_ID" >> "$GITHUB_ENV"
          conclusion="$(PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/source_validation.py \
            --run-id "$run_id" --head-sha "$DIRECT_HEAD" --event pull_request)"
          test "$conclusion" = "success $DIRECT_HEAD"

      - name: Merge exact validated Direct Worker PR
        if: ${{ steps.codex.outputs.status == 'CHANGED' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
        run: |
          set -euo pipefail
          merge_json="$(gh api --method PUT "repos/$PRODUCT_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge -f sha="$DIRECT_HEAD")"
          echo "$merge_json" | jq -e '.merged == true' >/dev/null
          INTEGRATED_SHA="$(echo "$merge_json" | jq -r '.sha')"
          test -n "$INTEGRATED_SHA" && test "$INTEGRATED_SHA" != "null"
          echo "INTEGRATED_SHA=$INTEGRATED_SHA" >> "$GITHUB_ENV"

      - name: Wait for exact integrated-SHA validation
        if: ${{ steps.codex.outputs.status == 'CHANGED' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
          VALIDATION_WORKFLOW_FILE: ${{ steps.route.outputs.validation_workflow_file }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh api \
              "repos/$PRODUCT_REPOSITORY/actions/workflows/$VALIDATION_WORKFLOW_FILE/runs?head_sha=$INTEGRATED_SHA&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id" || { echo "::error::Integrated-SHA validation run not found."; exit 1; }
          INTEGRATED_RUN_ID="$run_id"
          echo "INTEGRATED_RUN_ID=$INTEGRATED_RUN_ID" >> "$GITHUB_ENV"
          conclusion="$(PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/source_validation.py \
            --run-id "$run_id" --head-sha "$INTEGRATED_SHA" --event push)"
          test "$conclusion" = "success $INTEGRATED_SHA"

      - name: Record Direct Worker PASS
        if: ${{ steps.codex.outputs.status == 'CHANGED' }}
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
        run: |
          result_file="$RUNNER_TEMP/direct-worker-pass.md"
          {
            echo "## Direct Worker result"
            echo
            printf -- '- result: `%s`\n' "PASS"
            printf -- '- runner_run_id: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- source_base_sha: `%s`\n' "$START_HEAD"
            printf -- '- final_pr_head: `%s`\n' "$DIRECT_HEAD"
            printf -- '- exact_pr_head_validation_run: `%s`\n' "$PR_HEAD_RUN_ID"
            printf -- '- integrated_sha: `%s`\n' "$INTEGRATED_SHA"
            printf -- '- exact_integrated_sha_validation_run: `%s`\n' "$INTEGRATED_RUN_ID"
            printf -- '- provider/runtime/device/physical: `%s`\n' "NOT_RUN"
          } > "$result_file"
          gh pr comment "$PR_NUMBER" --repo "$PRODUCT_REPOSITORY" --body-file "$result_file"
          {
            echo "## Direct Worker PASS"
            echo
            printf -- '- project: `%s`\n' "${{ inputs.project }}"
            printf -- '- PR: #%s\n' "$PR_NUMBER"
            printf -- '- integrated SHA: `%s`\n' "$INTEGRATED_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Direct Worker failure on open PR
        if: ${{ failure() && env.PR_NUMBER != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.product_write_token }}
          PRODUCT_REPOSITORY: ${{ steps.route.outputs.repository }}
        run: |
          result_file="$RUNNER_TEMP/direct-worker-failed.md"
          {
            echo "## Direct Worker result"
            echo
            printf -- '- result: `%s`\n' "FAILED"
            printf -- '- runner_run_id: `%s`\n' "$GITHUB_RUN_ID"
            if [ -n "${DIRECT_HEAD:-}" ]; then printf -- '- head_sha: `%s`\n' "$DIRECT_HEAD"; fi
            printf -- '- action: `%s`\n' "Use Direct Worker retry; preserve this PR."
            printf -- '- provider/runtime/device/physical: `%s`\n' "NOT_INFERRED"
          } > "$result_file"
          gh pr comment "$PR_NUMBER" --repo "$PRODUCT_REPOSITORY" --body-file "$result_file"
