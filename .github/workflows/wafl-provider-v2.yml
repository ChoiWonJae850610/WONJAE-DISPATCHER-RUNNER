name: WAFL Provider v2

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  provider:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[PROVIDER-WAKE][DISPATCHER-V2] WAFL ')
    uses: ./.github/workflows/provider-action-core.yml
    with:
      project: WAFL
      product_repository: ChoiWonJae850610/WAFL
      target_branch: cloud-dev-v1
      wake_title: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED == 'true' }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
      product_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      expo_token: ${{ secrets.WAFL_EXPO_TOKEN }}
      github_provider_token: ${{ secrets.WAFL_PROVIDER_GITHUB_TOKEN }}

  status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.actor == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '[PROVIDER-STATUS]' &&
      startsWith(github.event.issue.title, '[PROVIDER-WAKE][DISPATCHER-V2] WAFL ')
    uses: ./.github/workflows/provider-status-core.yml
    with:
      project: WAFL
      product_repository: ChoiWonJae850610/WAFL
      target_branch: cloud-dev-v1
      wake_title: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED == 'true' }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
      product_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      expo_token: ${{ secrets.WAFL_EXPO_TOKEN }}
      github_provider_token: ${{ secrets.WAFL_PROVIDER_GITHUB_TOKEN }}
