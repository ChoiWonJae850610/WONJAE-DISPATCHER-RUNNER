name: Provider Action Core

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      product_repository:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      wake_title:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      control_repository:
        required: true
        type: string
      gmail_enabled:
        required: false
        type: boolean
        default: false
    secrets:
      control_read_token:
        required: true
      product_token:
        required: true
      expo_token:
        required: false
      github_provider_token:
        required: false
      gmail_username:
        required: false
      gmail_app_password:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: provider-v2-${{ inputs.project }}
      cancel-in-progress: false
    env:
      CONTROL_REPOSITORY: ${{ inputs.control_repository }}
      PROJECT: ${{ inputs.project }}
      PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      WAKE_TITLE: ${{ inputs.wake_title }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EAS_CLI_VERSION: "24.8.0"

    steps:
      - name: Runner · trusted code
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: WAKE · parse exact identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          project = os.environ["PROJECT"]
          title = os.environ["WAKE_TITLE"]
          match = re.fullmatch(
              rf"\[PROVIDER-WAKE\]\[DISPATCHER-V2\] {re.escape(project)} "
              rf"({re.escape(project)}-[A-Z0-9][A-Z0-9-]*-[0-9]{{3}}) "
              r"([0-9a-f]{40}) ([0-9a-f]{40})",
              title,
          )
          if match is None:
              raise SystemExit("invalid provider wake title")
          task_id, control_sha, source_sha = match.groups()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TASK_ID={task_id}\n")
              handle.write(f"CONTROL_SHA={control_sha}\n")
              handle.write(f"SOURCE_SHA={source_sha}\n")
              handle.write(f"CONTROL_RECORD_PATH=tasks-v2/{project}/{task_id}.json\n")
          PY
          python scripts/actions_progress.py WAKE PASS

      - name: CONTROL · checkout exact private record
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.control_repository }}
          ref: ${{ env.CONTROL_SHA }}
          path: .provider/control
          token: ${{ secrets.control_read_token }}
          persist-credentials: false

      - name: CONTROL · validate provider record
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C .provider/control rev-parse HEAD)"
          test "$actual" = "$CONTROL_SHA"
          record="$GITHUB_WORKSPACE/.provider/control/$CONTROL_RECORD_PATH"
          test -f "$record"
          python scripts/provider_action.py prepare             --record "$record"             --project "$PROJECT"             --repository "$PRODUCT_REPOSITORY"             --target-branch "$TARGET_BRANCH"             --wake-title "$WAKE_TITLE"             --control-sha "$CONTROL_SHA"             --source-sha "$SOURCE_SHA"             --github-env "$GITHUB_ENV"
          python scripts/actions_progress.py CONTROL PASS --sha "$CONTROL_SHA"

      - name: PRODUCT · checkout exact source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: .provider/product
          token: ${{ secrets.product_token }}
          fetch-depth: 0
          persist-credentials: false

      - name: PRODUCT · exact current source and validation gate
        env:
          GH_TOKEN: ${{ secrets.product_token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$PRODUCT_REPOSITORY/branches/$TARGET_BRANCH" --jq .commit.sha)"
          test "$current" = "$SOURCE_SHA" || {
            echo "::error::Target branch advanced after provider record creation."
            exit 1
          }
          conflict_prs="$(gh pr list --repo "$PRODUCT_REPOSITORY" --state open --base "$TARGET_BRANCH"             --json number,headRefName --jq '.[] | select(.headRefName | startswith("job/")) | "\(.number) \(.headRefName)"')"
          test -z "$conflict_prs" || {
            echo "::error::Source-writing job PR is open; provider action refuses stale/concurrent execution."
            echo "$conflict_prs"
            exit 1
          }
          validation_run="$(gh api             "repos/$PRODUCT_REPOSITORY/actions/workflows/$VALIDATION_WORKFLOW_FILE/runs?head_sha=$SOURCE_SHA&event=push&per_page=20"             --jq '.workflow_runs | map(select(.head_sha == env.SOURCE_SHA and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty')"
          test -n "$validation_run" || {
            echo "::error::Exact current source has no successful push validation."
            exit 1
          }
          echo "SOURCE_VALIDATION_RUN_ID=$validation_run" >> "$GITHUB_ENV"
          python scripts/actions_progress.py PRODUCT PASS --sha "$SOURCE_SHA"

      - name: PROVIDER · OTA compatibility gate
        if: env.PROVIDER_ACTION == 'eas_workflow_update' || env.PROVIDER_ACTION == 'eas_update'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/provider_action.py check-ota             --repo "$GITHUB_WORKSPACE/.provider/product"             --project "$PROJECT"             --base "$PROVIDER_COMPATIBILITY_BASE_SHA"             --head "$SOURCE_SHA"             --working-directory "$PROVIDER_WORKING_DIRECTORY"

      - name: PROVIDER · credential gate
        env:
          EXPO_TOKEN_VALUE: ${{ secrets.expo_token }}
          GITHUB_PROVIDER_TOKEN_VALUE: ${{ secrets.github_provider_token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          case "$PROVIDER_ACTION" in
            eas_workflow_update|eas_update)
              if [ -z "${EXPO_TOKEN_VALUE:-}" ]; then missing="EXPO_TOKEN"; fi
              ;;
            github_workflow_dispatch)
              if [ -z "${GITHUB_PROVIDER_TOKEN_VALUE:-}" ]; then missing="GITHUB_PROVIDER_TOKEN"; fi
              ;;
            *)
              echo "::error::Unsupported provider action."
              exit 1
              ;;
          esac
          if [ -n "$missing" ]; then
            echo "PROVIDER_GATE=missing_credential" >> "$GITHUB_ENV"
            {
              echo '## Dispatcher v2 provider completion evidence'
              echo
              printf -- '- task_id: `%s`\n' "$TASK_ID"
              printf -- '- attempt: `%s`\n' "$ATTEMPT"
              printf -- '- revision: `%s`\n' "$REVISION"
              printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
              printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
              printf -- '- source_validation_run: `%s`\n' "$SOURCE_VALIDATION_RUN_ID"
              printf -- '- action: `%s`\n' "$PROVIDER_ACTION"
              printf -- '- result: `MANUAL_REQUIRED`\n'
              echo "- blocking_action: add the project-scoped provider credential required by this adapter"
              printf -- '- runtime/device/physical: `NOT_RUN`\n'
            } > "$RUNNER_TEMP/provider-manual.md"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-manual.md"
          else
            echo "PROVIDER_GATE=ready" >> "$GITHUB_ENV"
          fi

      - name: STARTED · record provider execution
        if: env.PROVIDER_GATE == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Dispatcher v2 provider STARTED evidence'
            echo
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            printf -- '- attempt: `%s`\n' "$ATTEMPT"
            printf -- '- revision: `%s`\n' "$REVISION"
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            printf -- '- source_validation_run: `%s`\n' "$SOURCE_VALIDATION_RUN_ID"
            printf -- '- action: `%s`\n' "$PROVIDER_ACTION"
          } > "$RUNNER_TEMP/provider-started.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-started.md"
          python scripts/actions_progress.py STARTED PASS --sha "$SOURCE_SHA"

      - name: NOTIFY · GitHub-native provider STARTED
        if: inputs.gmail_enabled && env.PROVIDER_GATE == 'ready'
        continue-on-error: true
        env:
          GMAIL_USERNAME: ${{ secrets.gmail_username }}
          GMAIL_APP_PASSWORD: ${{ secrets.gmail_app_password }}
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/gmail_notify.py \
            --project "$PROJECT" \
            --task-id "$TASK_ID" \
            --attempt "$ATTEMPT" \
            --status STARTED \
            --profile "$PROFILE" \
            --control-sha "$CONTROL_SHA" \
            --source-sha "$SOURCE_SHA" \
            --integration-evidence "provider-action:$PROVIDER_ACTION source-validation:$SOURCE_VALIDATION_RUN_ID"

      - name: EAS · set up Node
        if: env.PROVIDER_GATE == 'ready' && (env.PROVIDER_ACTION == 'eas_workflow_update' || env.PROVIDER_ACTION == 'eas_update')
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: EAS · install pinned CLI
        if: env.PROVIDER_GATE == 'ready' && (env.PROVIDER_ACTION == 'eas_workflow_update' || env.PROVIDER_ACTION == 'eas_update')
        run: npm install --global "eas-cli@$EAS_CLI_VERSION"

      - name: EAS · run repository workflow update
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_workflow_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.provider/product/$PROVIDER_WORKING_DIRECTORY"
          args=()
          while IFS='=' read -r key value; do
            [ -n "$key" ] && args+=("-F" "$key=$value")
          done < <(python - <<'PY'
          import json, os
          for key, value in json.loads(os.environ.get("PROVIDER_INPUTS_JSON", "{}")).items():
              print(f"{key}={value}")
          PY
          )
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo "::error::Exact local source changed before EAS workflow upload."
            exit 1
          }
          eas workflow:run "$PROVIDER_WORKFLOW_FILE"             --non-interactive             --json             "${args[@]}" > "$RUNNER_TEMP/eas-workflow-run.json"
          python "$GITHUB_WORKSPACE/scripts/provider_action.py" parse-eas-run             --input "$RUNNER_TEMP/eas-workflow-run.json"             --github-env "$GITHUB_ENV"

      - name: EAS · install app dependencies for direct update
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.provider/product/$PROVIDER_WORKING_DIRECTORY"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: EAS · run direct compatible update
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.provider/product/$PROVIDER_WORKING_DIRECTORY"
          if [ -n "${PROVIDER_APP_VARIANT:-}" ]; then export APP_VARIANT="$PROVIDER_APP_VARIANT"; fi
          eas update             --channel "$PROVIDER_CHANNEL"             --environment "$PROVIDER_ENVIRONMENT"             --platform "$PROVIDER_PLATFORM"             --message "$PROVIDER_MESSAGE"             --json             --non-interactive > "$RUNNER_TEMP/eas-update-run.json"

      - name: EAS · resolve direct update group
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.provider/product/$PROVIDER_WORKING_DIRECTORY"
          eas update:list             --all             --platform "$PROVIDER_PLATFORM"             --runtime-version "$PROVIDER_RUNTIME_VERSION"             --limit 25             --json             --non-interactive > "$RUNNER_TEMP/eas-update-list.json"
          python "$GITHUB_WORKSPACE/scripts/provider_action.py" parse-update-group             --input "$RUNNER_TEMP/eas-update-list.json"             --message "$PROVIDER_MESSAGE"             --runtime-version "$PROVIDER_RUNTIME_VERSION"             --platform "$PROVIDER_PLATFORM"             --github-env "$GITHUB_ENV"

      - name: EAS · read back direct platform update
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EAS_UPDATE_GROUP_ID:-}" || { echo "::error::EAS update group identity is missing."; exit 1; }
          cd "$GITHUB_WORKSPACE/.provider/product/$PROVIDER_WORKING_DIRECTORY"
          eas update:view "$EAS_UPDATE_GROUP_ID"             --json > "$RUNNER_TEMP/eas-update-view.json"
          python "$GITHUB_WORKSPACE/scripts/provider_action.py" parse-update-view             --input "$RUNNER_TEMP/eas-update-view.json"             --group-id "$EAS_UPDATE_GROUP_ID"             --message "$PROVIDER_MESSAGE"             --runtime-version "$PROVIDER_RUNTIME_VERSION"             --platform "$PROVIDER_PLATFORM"             --github-env "$GITHUB_ENV"

      - name: GitHub provider · prepare dispatch
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'github_workflow_dispatch'
        shell: bash
        run: |
          python scripts/provider_action.py dispatch-payload             --ref "$TARGET_BRANCH"             --inputs-json "$PROVIDER_INPUTS_JSON"             --output "$RUNNER_TEMP/provider-dispatch.json"

      - name: GitHub provider · dispatch
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'github_workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.github_provider_token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api             "repos/$PRODUCT_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=50"             --jq '.workflow_runs[].id' | tr '\n' ' ')"
          gh api --method POST             "repos/$PRODUCT_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW_FILE/dispatches"             --input "$RUNNER_TEMP/provider-dispatch.json"
          run_id=""
          for _ in $(seq 1 36); do
            while read -r candidate; do
              if [[ " $before " != *" $candidate "* ]]; then
                run_id="$candidate"
                break
              fi
            done < <(gh api               "repos/$PRODUCT_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW_FILE/runs?head_sha=$SOURCE_SHA&event=workflow_dispatch&per_page=20"               --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
            [ -n "$run_id" ] && break
            sleep 10
          done
          test -n "$run_id" || { echo "::error::Provider workflow run not found."; exit 1; }
          echo "PROVIDER_GITHUB_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: RESULT · record queued external provider
        if: >-
          env.PROVIDER_GATE == 'ready' &&
          (env.PROVIDER_ACTION == 'eas_workflow_update' || env.PROVIDER_ACTION == 'github_workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="${EAS_WORKFLOW_ID:-${PROVIDER_GITHUB_RUN_ID:-}}"
          test -n "$run_id"
          {
            echo '## Dispatcher v2 provider QUEUED evidence'
            echo
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            printf -- '- attempt: `%s`\n' "$ATTEMPT"
            printf -- '- revision: `%s`\n' "$REVISION"
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            printf -- '- source_validation_run: `%s`\n' "$SOURCE_VALIDATION_RUN_ID"
            printf -- '- action: `%s`\n' "$PROVIDER_ACTION"
            printf -- '- provider_run_id: `%s`\n' "$run_id"
            printf -- '- result: `QUEUED`\n'
            printf -- '- device/physical: `NOT_RUN`\n'
          } > "$RUNNER_TEMP/provider-queued.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-queued.md"

      - name: RESULT · record provider PASS
        if: env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Dispatcher v2 provider completion evidence'
            echo
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            printf -- '- attempt: `%s`\n' "$ATTEMPT"
            printf -- '- revision: `%s`\n' "$REVISION"
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            printf -- '- source_validation_run: `%s`\n' "$SOURCE_VALIDATION_RUN_ID"
            printf -- '- action: `%s`\n' "$PROVIDER_ACTION"
            if [ -n "${EAS_WORKFLOW_ID:-}" ]; then printf -- '- provider_run_id: `%s`\n' "$EAS_WORKFLOW_ID"; fi
            if [ -n "${PROVIDER_GITHUB_RUN_ID:-}" ]; then printf -- '- provider_run_id: `%s`\n' "$PROVIDER_GITHUB_RUN_ID"; fi
            if [ -n "${EAS_UPDATE_ID:-}" ]; then printf -- '- update_id: `%s`\n' "$EAS_UPDATE_ID"; fi
            if [ -n "${EAS_UPDATE_GROUP_ID:-}" ]; then printf -- '- update_group_id: `%s`\n' "$EAS_UPDATE_GROUP_ID"; fi
            if [ -n "${PROVIDER_RUNTIME_VERSION:-}" ]; then printf -- '- runtime_version: `%s`\n' "$PROVIDER_RUNTIME_VERSION"; fi
            if [ -n "${PROVIDER_CHANNEL:-}" ]; then printf -- '- channel: `%s`\n' "$PROVIDER_CHANNEL"; fi
            if [ -n "${PROVIDER_ENVIRONMENT:-}" ]; then printf -- '- environment: `%s`\n' "$PROVIDER_ENVIRONMENT"; fi
            printf -- '- result: `PASS`\n'
            printf -- '- device/physical: `NOT_RUN`\n'
          } > "$RUNNER_TEMP/provider-result.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-result.md"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          python scripts/actions_progress.py RESULT PASS --sha "$SOURCE_SHA"

      - name: NOTIFY · GitHub-native provider COMPLETED
        if: inputs.gmail_enabled && env.PROVIDER_GATE == 'ready' && env.PROVIDER_ACTION == 'eas_update'
        continue-on-error: true
        env:
          GMAIL_USERNAME: ${{ secrets.gmail_username }}
          GMAIL_APP_PASSWORD: ${{ secrets.gmail_app_password }}
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/gmail_notify.py \
            --project "$PROJECT" \
            --task-id "$TASK_ID" \
            --attempt "$ATTEMPT" \
            --status COMPLETED \
            --profile "$PROFILE" \
            --control-sha "$CONTROL_SHA" \
            --source-sha "$SOURCE_SHA" \
            --integration-evidence "provider-action:$PROVIDER_ACTION source-validation:$SOURCE_VALIDATION_RUN_ID"

      - name: NOTIFY · GitHub-native provider MANUAL_REQUIRED
        if: inputs.gmail_enabled && env.PROVIDER_GATE == 'missing_credential'
        continue-on-error: true
        env:
          GMAIL_USERNAME: ${{ secrets.gmail_username }}
          GMAIL_APP_PASSWORD: ${{ secrets.gmail_app_password }}
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/gmail_notify.py \
            --project "$PROJECT" \
            --task-id "$TASK_ID" \
            --attempt "$ATTEMPT" \
            --status MANUAL_REQUIRED \
            --profile "$PROFILE" \
            --control-sha "$CONTROL_SHA" \
            --source-sha "$SOURCE_SHA" \
            --smallest-next-action "add the exact project-scoped provider credential"

      - name: RESULT · manual credential gate
        if: env.PROVIDER_GATE == 'missing_credential'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
          echo "::error::Project-scoped provider credential is required. See wake issue evidence."
          exit 1

      - name: RESULT · unexpected failure evidence
        if: failure() && env.PROVIDER_GATE != 'missing_credential'
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ENABLED: ${{ inputs.gmail_enabled }}
          GMAIL_USERNAME: ${{ secrets.gmail_username }}
          GMAIL_APP_PASSWORD: ${{ secrets.gmail_app_password }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${EAS_WORKFLOW_ID:-${PROVIDER_GITHUB_RUN_ID:-}}"
          if [ -n "$run_id" ]; then
            {
              echo '## Dispatcher v2 provider QUEUED evidence'
              echo
              printf -- '- task_id: `%s`\n' "${TASK_ID:-unknown}"
              printf -- '- attempt: `%s`\n' "${ATTEMPT:-unknown}"
              printf -- '- revision: `%s`\n' "${REVISION:-unknown}"
              printf -- '- control_sha: `%s`\n' "${CONTROL_SHA:-unknown}"
              printf -- '- source_sha: `%s`\n' "${SOURCE_SHA:-unknown}"
              printf -- '- action: `%s`\n' "${PROVIDER_ACTION:-unknown}"
              printf -- '- provider_run_id: `%s`\n' "$run_id"
              printf -- '- result: `QUEUED`\n'
              printf -- '- device/physical: `NOT_RUN`\n'
              echo '- note: launch runner failed after provider run identity was captured; reconcile this exact run only'
            } > "$RUNNER_TEMP/provider-failed-after-launch.md"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-failed-after-launch.md" || true
            exit 0
          fi

          result="FAILED"
          next_action="inspect the exact launch failure before retry"
          if [ "${PROVIDER_GATE:-}" = "ready" ]; then
            result="MANUAL_REQUIRED"
            next_action="inspect provider launch state before any resubmission because STARTED was recorded without a provider run identity"
          fi
          {
            echo '## Dispatcher v2 provider completion evidence'
            echo
            printf -- '- task_id: `%s`\n' "${TASK_ID:-unknown}"
            if [ -n "${ATTEMPT:-}" ]; then printf -- '- attempt: `%s`\n' "$ATTEMPT"; fi
            if [ -n "${REVISION:-}" ]; then printf -- '- revision: `%s`\n' "$REVISION"; fi
            printf -- '- control_sha: `%s`\n' "${CONTROL_SHA:-unknown}"
            printf -- '- source_sha: `%s`\n' "${SOURCE_SHA:-unknown}"
            printf -- '- action: `%s`\n' "${PROVIDER_ACTION:-unknown}"
            printf -- '- result: `%s`\n' "$result"
            printf -- '- blocking_action: %s\n' "$next_action"
            printf -- '- runtime/device/physical: `NOT_INFERRED`\n'
          } > "$RUNNER_TEMP/provider-failed.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/provider-failed.md" || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
          if [ "$GMAIL_ENABLED" = "true" ] && [ -n "${ATTEMPT:-}" ]; then
            PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/gmail_notify.py \
              --project "$PROJECT" \
              --task-id "$TASK_ID" \
              --attempt "$ATTEMPT" \
              --status "$result" \
              --profile "${PROFILE:-}" \
              --control-sha "${CONTROL_SHA:-}" \
              --source-sha "${SOURCE_SHA:-}" \
              --smallest-next-action "$next_action" || true
          fi
