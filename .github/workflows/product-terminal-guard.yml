name: Product Dispatcher Terminal Guard

on:
  workflow_run:
    workflows:
      - CLASSMO Dispatcher v2
      - WAFL Dispatcher v2
      - ESC Dispatcher v2
      - MUVEL Dispatcher v2
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  terminalize:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WAKE_TITLE: ${{ github.event.workflow_run.display_title }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}

    steps:
      - name: Parse exact source wake identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          title = os.environ["WAKE_TITLE"]
          match = re.fullmatch(
              r"\[PRODUCT-WAKE\]\[DISPATCHER-V2\] "
              r"(CLASSMO|WAFL|ESC|MUVEL) "
              r"([A-Z0-9][A-Z0-9-]*-[0-9]{3}) "
              r"([0-9a-f]{40}) ([0-9a-f]{40})",
              title,
          )
          if match is None:
              raise SystemExit("completed source run did not have an exact Dispatcher v2 wake title")
          project, task_id, control_sha, source_sha = match.groups()
          if not task_id.startswith(project + "-"):
              raise SystemExit("source wake task namespace mismatch")
          expected_workflow = f"{project} Dispatcher v2"
          applicable = os.environ["SOURCE_WORKFLOW_NAME"] == expected_workflow
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"GUARD_APPLICABLE={'true' if applicable else 'false'}\n")
              handle.write(f"PROJECT={project}\n")
              handle.write(f"TASK_ID={task_id}\n")
              handle.write(f"CONTROL_SHA={control_sha}\n")
              handle.write(f"SOURCE_SHA={source_sha}\n")
          PY

      - name: Record terminal state if source runner left the wake open
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GUARD_APPLICABLE:-false}" != "true" ]; then
            echo "Ignoring non-matching source workflow $SOURCE_WORKFLOW_NAME for $PROJECT wake."
            exit 0
          fi
          issues_json="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100&sort=created&direction=desc")"
          issue_number="$(echo "$issues_json" | jq -r --arg title "$WAKE_TITLE" '[.[] | select(.pull_request == null and .title == $title)] | first | .number // empty')"
          test -n "$issue_number" || { echo "::error::Exact source wake issue was not found."; exit 1; }

          issue_state="$(echo "$issues_json" | jq -r --argjson number "$issue_number" '.[] | select(.number == $number) | .state')"
          comments_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100")"
          if echo "$comments_json" | jq -e 'map(.body // "") | any(contains("## Dispatcher v2 terminal evidence") or contains("## Dispatcher v2 completion evidence"))' >/dev/null; then
            echo "Terminal evidence already exists; no duplicate guard result."
            exit 0
          fi
          if [ "$issue_state" = "closed" ]; then
            echo "Wake issue is already closed; no duplicate guard result."
            exit 0
          fi

          case "$SOURCE_CONCLUSION" in
            cancelled)
              result="CANCELLED"
              ;;
            action_required)
              result="MANUAL_REQUIRED"
              ;;
            *)
              result="FAILED"
              ;;
          esac

          terminal_file="$RUNNER_TEMP/source-terminal-guard.md"
          {
            echo '## Dispatcher v2 terminal evidence'
            echo
            printf -- '- project: `%s`\n' "$PROJECT"
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            printf -- '- runner_run_id: `%s`\n' "$SOURCE_RUN_ID"
            printf -- '- runner_conclusion: `%s`\n' "$SOURCE_CONCLUSION"
            printf -- '- result: `%s`\n' "$result"
            printf -- '- next_action: inspect the exact runner and product PR evidence; do not leave STARTED non-terminal\n'
            printf -- '- runtime/device/physical: `NOT_INFERRED`\n'
          } > "$terminal_file"

          gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$terminal_file"
          gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
