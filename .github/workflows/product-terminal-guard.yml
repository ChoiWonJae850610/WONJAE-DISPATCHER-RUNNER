name: Product Dispatcher Terminal Guard

run-name: Source terminal reconciliation

on:
  workflow_run:
    workflows:
      - CLASSMO Dispatcher v2
      - WAFL Dispatcher v2
      - ESC Dispatcher v2
      - MUVEL Dispatcher v2
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing exact source run only; never restart it
        required: true
        type: string
      wake_issue_number:
        description: Existing exact source wake, or recover its verified dispatch claim
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  context:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'action_required' ||
        github.event.workflow_run.conclusion == 'neutral' ||
        github.event.workflow_run.conclusion == 'stale' ||
        github.event.workflow_run.conclusion == 'startup_failure')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '[SOURCE-TERMINAL-RECONCILE] '))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      project: ${{ steps.identity.outputs.project }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      wake_issue_number: ${{ steps.identity.outputs.wake_issue_number }}
      product_pr: ${{ steps.identity.outputs.product_pr }}
      last_head: ${{ steps.identity.outputs.last_head }}
      owner_reconciliation: ${{ steps.identity.outputs.owner_reconciliation }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact existing source run path and wake identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/source_terminal.py select

  classmo:
    needs: context
    if: needs.context.outputs.project == 'CLASSMO'
    uses: ./.github/workflows/source-terminal-core.yml
    with:
      project: CLASSMO
      source_run_id: ${{ needs.context.outputs.source_run_id }}
      wake_issue_number: ${{ needs.context.outputs.wake_issue_number }}
      product_pr: ${{ needs.context.outputs.product_pr }}
      last_head: ${{ needs.context.outputs.last_head }}
      owner_reconciliation: ${{ needs.context.outputs.owner_reconciliation }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED }}
    secrets:
      product_token: ${{ secrets.CLASSMO_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}

  wafl:
    needs: context
    if: needs.context.outputs.project == 'WAFL'
    uses: ./.github/workflows/source-terminal-core.yml
    with:
      project: WAFL
      source_run_id: ${{ needs.context.outputs.source_run_id }}
      wake_issue_number: ${{ needs.context.outputs.wake_issue_number }}
      product_pr: ${{ needs.context.outputs.product_pr }}
      last_head: ${{ needs.context.outputs.last_head }}
      owner_reconciliation: ${{ needs.context.outputs.owner_reconciliation }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED }}
    secrets:
      product_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}

  esc:
    needs: context
    if: needs.context.outputs.project == 'ESC'
    uses: ./.github/workflows/source-terminal-core.yml
    with:
      project: ESC
      source_run_id: ${{ needs.context.outputs.source_run_id }}
      wake_issue_number: ${{ needs.context.outputs.wake_issue_number }}
      product_pr: ${{ needs.context.outputs.product_pr }}
      last_head: ${{ needs.context.outputs.last_head }}
      owner_reconciliation: ${{ needs.context.outputs.owner_reconciliation }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED }}
    secrets:
      product_token: ${{ secrets.ESC_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}

  muvel:
    needs: context
    if: needs.context.outputs.project == 'MUVEL'
    uses: ./.github/workflows/source-terminal-core.yml
    with:
      project: MUVEL
      source_run_id: ${{ needs.context.outputs.source_run_id }}
      wake_issue_number: ${{ needs.context.outputs.wake_issue_number }}
      product_pr: ${{ needs.context.outputs.product_pr }}
      last_head: ${{ needs.context.outputs.last_head }}
      owner_reconciliation: ${{ needs.context.outputs.owner_reconciliation }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
      gmail_enabled: ${{ vars.WONJAE_NATIVE_GMAIL_ENABLED }}
    secrets:
      product_token: ${{ secrets.MUVEL_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      gmail_username: ${{ secrets.GMAIL_USERNAME }}
      gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
