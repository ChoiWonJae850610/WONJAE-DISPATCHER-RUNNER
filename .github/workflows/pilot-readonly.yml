name: Codex Read-only Pilot

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Exact 40-character control commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  readonly:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_REPOSITORY: ${{ vars.CONTROL_REPOSITORY }}
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Require protected configuration
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CONTROL_READ_TOKEN: ${{ secrets.CONTROL_READ_TOKEN }}
          SECRET_ROTATION_TOKEN: ${{ secrets.SECRET_ROTATION_TOKEN }}
        run: |
          test -n "$CONTROL_REPOSITORY" || {
            echo "::error::CONTROL_REPOSITORY variable is not configured."
            exit 1
          }
          test -n "$CODEX_AUTH_JSON" || {
            echo "::error::CODEX_AUTH_JSON secret is not configured."
            exit 1
          }
          test -n "$CONTROL_READ_TOKEN" || {
            echo "::error::CONTROL_READ_TOKEN secret is not configured."
            exit 1
          }
          test -n "$SECRET_ROTATION_TOKEN" || {
            echo "::error::SECRET_ROTATION_TOKEN secret is not configured."
            exit 1
          }

      - name: Checkout trusted runner code
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Initialize ephemeral paths
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          echo "CONTROL_CHECKOUT=$GITHUB_WORKSPACE/.pilot/control" >> "$GITHUB_ENV"

      - name: Checkout exact private control commit
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.CONTROL_REPOSITORY }}
          ref: ${{ inputs.expected_control_sha }}
          path: .pilot/control
          token: ${{ secrets.CONTROL_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact checkout before Codex
        run: |
          actual="$(git -C "$CONTROL_CHECKOUT" rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CONTROL_SHA" || {
            echo "::error::Exact checkout mismatch."
            exit 1
          }
          echo "CONTROL_EXACT_SHA=$actual"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runner
        run: python -m pip install .

      - name: Run Codex read-only exact-SHA probe
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python scripts/run_readonly_pilot.py

      - name: Persist any rotated Codex credential
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.SECRET_ROTATION_TOKEN }}
        run: |
          test -s "$CODEX_HOME/auth.json"
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
          echo "CODEX_AUTH_JSON_UPDATED=true"

      - name: Delete ephemeral credential files
        if: ${{ always() }}
        run: rm -rf "$CODEX_HOME"
