name: MUVEL Provider v2

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  provider:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[PROVIDER-WAKE][DISPATCHER-V2] MUVEL ')
    uses: ./.github/workflows/provider-action-core.yml
    with:
      project: MUVEL
      product_repository: ChoiWonJae850610/MUVEL
      target_branch: cloud-dev-v1
      wake_title: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_token: ${{ secrets.MUVEL_WRITE_TOKEN }}
      github_provider_token: ${{ secrets.MUVEL_PROVIDER_GITHUB_TOKEN }}

  status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.actor == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '[PROVIDER-STATUS]' &&
      startsWith(github.event.issue.title, '[PROVIDER-WAKE][DISPATCHER-V2] MUVEL ')
    uses: ./.github/workflows/provider-status-core.yml
    with:
      project: MUVEL
      product_repository: ChoiWonJae850610/MUVEL
      target_branch: cloud-dev-v1
      wake_title: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
      control_repository: ${{ vars.CONTROL_REPOSITORY }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_token: ${{ secrets.MUVEL_WRITE_TOKEN }}
      github_provider_token: ${{ secrets.MUVEL_PROVIDER_GITHUB_TOKEN }}
