name: Dispatcher v2 Event Wake Pilot

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  event-pilot:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(
        github.event.issue.title,
        '[WAKE][DISPATCHER-V2] CONTROL-DISPATCHER-V2-WAKE-WRITE-001 '
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_REPOSITORY: ${{ vars.CONTROL_REPOSITORY }}
      WAKE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      PILOT_BRANCH: pilot/CONTROL-DISPATCHER-V2-WAKE-WRITE-001
      PILOT_PATH: docs/pilots/DISPATCHER_V2_WAKE_WRITE_001.md
      PYTHONUNBUFFERED: "1"

    steps:
      - name: "[00] Security · protected configuration"
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CONTROL_WRITE_TOKEN: ${{ secrets.CONTROL_WRITE_TOKEN }}
          SECRET_ROTATION_TOKEN: ${{ secrets.SECRET_ROTATION_TOKEN }}
        run: |
          test -n "$CONTROL_REPOSITORY" || { echo "::error::CONTROL_REPOSITORY is missing."; exit 1; }
          test -n "$CODEX_AUTH_JSON" || { echo "::error::CODEX_AUTH_JSON is missing."; exit 1; }
          test -n "$CONTROL_WRITE_TOKEN" || { echo "::error::CONTROL_WRITE_TOKEN is missing."; exit 1; }
          test -n "$SECRET_ROTATION_TOKEN" || { echo "::error::SECRET_ROTATION_TOKEN is missing."; exit 1; }

      - name: "[01] WAKE · trusted event"
        run: |
          python - <<'PY'
          import os
          import re

          title = os.environ["WAKE_TITLE"]
          match = re.fullmatch(
              r"\[WAKE\]\[DISPATCHER-V2\] CONTROL-DISPATCHER-V2-WAKE-WRITE-001 ([0-9a-f]{40})",
              title,
          )
          if match is None:
              raise SystemExit("invalid trusted wake title")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"EXPECTED_CONTROL_SHA={match.group(1)}\n")
          PY

      - name: "[02] Runner · trusted code"
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: "[01] WAKE · progress"
        run: python scripts/actions_progress.py WAKE PASS

      - name: "[02] Runner · ephemeral paths"
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          echo "CONTROL_CHECKOUT=$GITHUB_WORKSPACE/.pilot/control" >> "$GITHUB_ENV"

      - name: "[03] CONTROL · checkout current main"
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.CONTROL_REPOSITORY }}
          ref: main
          path: .pilot/control
          token: ${{ secrets.CONTROL_WRITE_TOKEN }}
          persist-credentials: false

      - name: "[03] CONTROL · verify exact baseline"
        run: |
          actual="$(git -C "$CONTROL_CHECKOUT" rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CONTROL_SHA" || {
            echo "::error::Control main moved after wake event."
            exit 1
          }
          test -z "$(git -C "$CONTROL_CHECKOUT" status --porcelain=v1 --untracked-files=all)" || {
            echo "::error::Control checkout is not clean."
            exit 1
          }
          echo "CONTROL_EXACT_SHA=$actual"
          python "$GITHUB_WORKSPACE/scripts/actions_progress.py" CONTROL PASS --sha "$actual"

      - name: "[04] WRITE · prepare bounded branch"
        run: |
          git -C "$CONTROL_CHECKOUT" checkout -b "$PILOT_BRANCH"
          git -C "$CONTROL_CHECKOUT" config user.name "WONJAE Dispatcher Runner"
          git -C "$CONTROL_CHECKOUT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "[04] CODEX · Python runtime"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "[04] CODEX · install runner"
        run: python -m pip install .

      - name: "[04] CODEX · authenticated handoff"
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          python scripts/actions_progress.py CODEX RUNNING
          python scripts/run_event_pilot.py
          python scripts/actions_progress.py CODEX PASS

      - name: "[05] WRITE · validate exact diff and commit"
        run: |
          cd "$CONTROL_CHECKOUT"
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$PILOT_PATH"
          git add -- "$PILOT_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$PILOT_PATH"
          git commit -m "pilot: validate event wake write path"
          head="$(git rev-parse HEAD)"
          echo "PILOT_HEAD_SHA=$head" >> "$GITHUB_ENV"
          python "$GITHUB_WORKSPACE/scripts/actions_progress.py" WRITE PASS --sha "$head"

      - name: "[06] STARTED · publish branch"
        env:
          GH_TOKEN: ${{ secrets.CONTROL_WRITE_TOKEN }}
        run: |
          cd "$CONTROL_CHECKOUT"
          gh auth setup-git
          git push --set-upstream origin "HEAD:refs/heads/$PILOT_BRANCH"

      - name: "[06] STARTED · create Draft PR"
        env:
          GH_TOKEN: ${{ secrets.CONTROL_WRITE_TOKEN }}
        run: |
          cd "$CONTROL_CHECKOUT"
          pr_url="$(gh pr create             --repo "$CONTROL_REPOSITORY"             --draft             --base main             --head "$PILOT_BRANCH"             --title "[PILOT][DISPATCHER-V2] CONTROL-DISPATCHER-V2-WAKE-WRITE-001"             --body "Event-wake documentation pilot. No product TASK or product repository mutation. Source baseline: $EXPECTED_CONTROL_SHA. Head: $PILOT_HEAD_SHA.")"
          echo "PILOT_PR_URL=$pr_url" >> "$GITHUB_ENV"

      - name: "[06] STARTED · read back Draft PR"
        env:
          GH_TOKEN: ${{ secrets.CONTROL_WRITE_TOKEN }}
        run: |
          json="$(gh pr view "$PILOT_PR_URL" --repo "$CONTROL_REPOSITORY"             --json number,url,isDraft,state,baseRefName,headRefName,headRefOid)"
          echo "$json" | jq -e --arg branch "$PILOT_BRANCH" --arg sha "$PILOT_HEAD_SHA" '
            .isDraft == true and
            .state == "OPEN" and
            .baseRefName == "main" and
            .headRefName == $branch and
            .headRefOid == $sha
          ' >/dev/null
          pr_number="$(echo "$json" | jq -r .number)"
          head_sha="$(echo "$json" | jq -r .headRefOid)"
          echo "PILOT_PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
          echo "PILOT_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "PILOT_PR_URL=$(echo "$json" | jq -r .url)" >> "$GITHUB_ENV"
          python "$GITHUB_WORKSPACE/scripts/actions_progress.py" STARTED PASS --sha "$head_sha" --pr "$pr_number"

      - name: "[07] Auth · persist rotated Codex credential"
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.SECRET_ROTATION_TOKEN }}
        run: |
          test -s "$CODEX_HOME/auth.json"
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
          echo "CODEX_AUTH_JSON_UPDATED=true"

      - name: "[08] RESULT · PASS"
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "PASS: the trusted wake event started the runner automatically and one private Draft PR was created and read back."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          python scripts/actions_progress.py RESULT PASS --sha "$PILOT_HEAD_SHA" --pr "$PILOT_PR_NUMBER"

      - name: "[08] RESULT · failure evidence"
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "FAIL: inspect this public Actions run for the bounded wake pilot. No broader authority was granted."
          python scripts/actions_progress.py RESULT FAIL || true

      - name: "[09] Cleanup · ephemeral credentials"
        if: ${{ always() }}
        run: rm -rf "$CODEX_HOME"
