name: Provider Dispatcher Terminal Guard

on:
  workflow_run:
    workflows:
      - CLASSMO Provider v2
      - WAFL Provider v2
      - ESC Provider v2
      - MUVEL Provider v2
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  terminalize:
    if: >-
      startsWith(github.event.workflow_run.display_title, '[PROVIDER-WAKE][DISPATCHER-V2] ') &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WAKE_TITLE: ${{ github.event.workflow_run.display_title }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      CONTROL_REPOSITORY: ${{ vars.CONTROL_REPOSITORY }}

    steps:
      - name: Runner · trusted notification code
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Parse exact provider wake identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          title = os.environ["WAKE_TITLE"]
          match = re.fullmatch(
              r"\[PROVIDER-WAKE\]\[DISPATCHER-V2\] "
              r"(CLASSMO|WAFL|ESC|MUVEL) "
              r"([A-Z0-9][A-Z0-9-]*-[0-9]{3}) "
              r"([0-9a-f]{40}) ([0-9a-f]{40})",
              title,
          )
          if match is None:
              raise SystemExit("completed provider run did not have an exact provider wake title")
          project, task_id, control_sha, source_sha = match.groups()
          if not task_id.startswith(project + "-"):
              raise SystemExit("provider wake task namespace mismatch")
          if os.environ["SOURCE_WORKFLOW"] != f"{project} Provider v2":
              raise SystemExit("provider workflow/project mismatch")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PROJECT={project}\n")
              handle.write(f"TASK_ID={task_id}\n")
              handle.write(f"CONTROL_SHA={control_sha}\n")
              handle.write(f"SOURCE_SHA={source_sha}\n")
          PY

      - name: Recover exact wake lifecycle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issues_json="$RUNNER_TEMP/provider-issues.json"
          comments_json="$RUNNER_TEMP/provider-comments.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100&sort=created&direction=desc" > "$issues_json"
          issue_number="$(PYTHONPATH="$GITHUB_WORKSPACE/src" ISSUES_JSON="$issues_json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from wonjae_dispatcher_runner.provider_guard import exact_provider_wake

          pages = json.loads(Path(os.environ["ISSUES_JSON"]).read_text())
          issue = exact_provider_wake(
              [item for page in pages for item in page],
              title=os.environ["WAKE_TITLE"], owner=os.environ["GITHUB_REPOSITORY_OWNER"],
          )
          print(issue["number"])
          PY
          )"
          echo "ISSUE_NUMBER=$issue_number" >> "$GITHUB_ENV"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" > "$comments_json"
          PYTHONPATH="$GITHUB_WORKSPACE/src" COMMENTS_JSON="$comments_json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from wonjae_dispatcher_runner.provider_guard import provider_lifecycle

          pages = json.loads(Path(os.environ["COMMENTS_JSON"]).read_text())
          values = provider_lifecycle(
              [item for page in pages for item in page],
              task_id=os.environ["TASK_ID"], control_sha=os.environ["CONTROL_SHA"],
              source_sha=os.environ["SOURCE_SHA"],
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Preserve queued provider or close terminal residue
        if: env.PROVIDER_TERMINAL_EXISTS == 'true' || env.PROVIDER_QUEUED_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROVIDER_TERMINAL_EXISTS" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
            echo "Provider terminal evidence already exists."
          else
            echo "Provider run identity is queued; preserve the open issue for status reconciliation."
          fi

      - name: Terminalize provider STARTED without recoverable run identity
        if: env.PROVIDER_TERMINAL_EXISTS != 'true' && env.PROVIDER_QUEUED_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="FAILED"
          blocking_action="inspect the exact provider runner failure before retry"
          if [ "$PROVIDER_STARTED_EXISTS" = "true" ]; then
            result="MANUAL_REQUIRED"
            blocking_action="inspect provider launch state before any resubmission; STARTED exists but no provider run identity was captured"
          elif [ "$SOURCE_CONCLUSION" = "cancelled" ]; then
            result="CANCELLED"
          fi
          terminal_file="$RUNNER_TEMP/provider-terminal-guard.md"
          {
            echo '## Dispatcher v2 provider completion evidence'
            echo
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            if [ -n "${ATTEMPT:-}" ]; then printf -- '- attempt: `%s`\n' "$ATTEMPT"; fi
            if [ -n "${REVISION:-}" ]; then printf -- '- revision: `%s`\n' "$REVISION"; fi
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            if [ -n "${PROVIDER_ACTION:-}" ]; then printf -- '- action: `%s`\n' "$PROVIDER_ACTION"; fi
            printf -- '- runner_run_id: `%s`\n' "$SOURCE_RUN_ID"
            printf -- '- runner_conclusion: `%s`\n' "$SOURCE_CONCLUSION"
            printf -- '- result: `%s`\n' "$result"
            printf -- '- blocking_action: %s\n' "$blocking_action"
            printf -- '- runtime/device/physical: `NOT_INFERRED`\n'
          } > "$terminal_file"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$terminal_file"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          echo "PROVIDER_TERMINAL_RESULT=$result" >> "$GITHUB_ENV"

      - name: GitHub-native Gmail · reconcile provider terminal notification
        if: ${{ always() && vars.WONJAE_NATIVE_GMAIL_ENABLED == 'true' && env.PROVIDER_QUEUED_EXISTS != 'true' }}
        continue-on-error: true
        env:
          CONTROL_READ_TOKEN: ${{ secrets.CONTROL_READ_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_REPOSITORY" || {
            echo "::warning::CONTROL_REPOSITORY missing; provider Gmail reconciliation skipped."
            exit 0
          }
          record="$RUNNER_TEMP/native-gmail-provider-control.json"
          GH_TOKEN="$CONTROL_READ_TOKEN" gh api \
            "repos/$CONTROL_REPOSITORY/contents/tasks-v2/$PROJECT/$TASK_ID.json?ref=$CONTROL_SHA" \
            --jq .content | base64 --decode > "$record"
          ATTEMPT="$(jq -r '.attempt // empty' "$record")"
          PROFILE="$(jq -r '.profile // empty' "$record")"
          test -n "$ATTEMPT" || {
            echo "::warning::Provider attempt identity unavailable; Gmail reconciliation skipped."
            exit 0
          }
          evidence_result="${PROVIDER_TERMINAL_RESULT:-}"
          case "$evidence_result" in
            PASS) mail_status="COMPLETED" ;;
            MANUAL_REQUIRED) mail_status="MANUAL_REQUIRED" ;;
            CANCELLED|CANCELED) mail_status="CANCELLED" ;;
            FAILED) mail_status="FAILED" ;;
            *)
              case "$SOURCE_CONCLUSION" in
                cancelled) mail_status="CANCELLED" ;;
                action_required) mail_status="MANUAL_REQUIRED" ;;
                *) mail_status="FAILED" ;;
              esac
              ;;
          esac
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/gmail_notify.py \
            --project "$PROJECT" \
            --task-id "$TASK_ID" \
            --attempt "$ATTEMPT" \
            --status "$mail_status" \
            --profile "$PROFILE" \
            --control-sha "$CONTROL_SHA" \
            --source-sha "$SOURCE_SHA" \
            --smallest-next-action "inspect the exact provider terminal evidence before any retry"
