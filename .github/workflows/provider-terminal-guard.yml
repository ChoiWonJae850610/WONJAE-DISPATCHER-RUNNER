name: Provider Dispatcher Terminal Guard

on:
  workflow_run:
    workflows:
      - CLASSMO Provider v2
      - WAFL Provider v2
      - ESC Provider v2
      - MUVEL Provider v2
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  terminalize:
    if: >-
      startsWith(github.event.workflow_run.display_title, '[PROVIDER-WAKE][DISPATCHER-V2] ') &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WAKE_TITLE: ${{ github.event.workflow_run.display_title }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    steps:
      - name: Parse exact provider wake identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          title = os.environ["WAKE_TITLE"]
          match = re.fullmatch(
              r"\[PROVIDER-WAKE\]\[DISPATCHER-V2\] "
              r"(CLASSMO|WAFL|ESC|MUVEL) "
              r"([A-Z0-9][A-Z0-9-]*-[0-9]{3}) "
              r"([0-9a-f]{40}) ([0-9a-f]{40})",
              title,
          )
          if match is None:
              raise SystemExit("completed provider run did not have an exact provider wake title")
          project, task_id, control_sha, source_sha = match.groups()
          if not task_id.startswith(project + "-"):
              raise SystemExit("provider wake task namespace mismatch")
          if os.environ["SOURCE_WORKFLOW"] != f"{project} Provider v2":
              raise SystemExit("provider workflow/project mismatch")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PROJECT={project}\n")
              handle.write(f"TASK_ID={task_id}\n")
              handle.write(f"CONTROL_SHA={control_sha}\n")
              handle.write(f"SOURCE_SHA={source_sha}\n")
          PY

      - name: Recover exact wake lifecycle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issues_json="$RUNNER_TEMP/provider-issues.json"
          comments_json="$RUNNER_TEMP/provider-comments.json"
          gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100&sort=created&direction=desc" > "$issues_json"
          issue_number="$(jq -r --arg title "$WAKE_TITLE" '[.[] | select(.pull_request == null and .title == $title)] | first | .number // empty' "$issues_json")"
          test -n "$issue_number" || { echo "::error::Exact provider wake issue was not found."; exit 1; }
          echo "ISSUE_NUMBER=$issue_number" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" > "$comments_json"
          COMMENTS_JSON="$comments_json" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          comments = json.loads(Path(os.environ["COMMENTS_JSON"]).read_text(encoding="utf-8"))
          bodies = [item.get("body") or "" for item in comments if isinstance(item, dict)]
          terminal = any("## Dispatcher v2 provider completion evidence" in body for body in bodies)
          queued = any("## Dispatcher v2 provider QUEUED evidence" in body for body in bodies)
          started_body = next(
              (body for body in reversed(bodies) if "## Dispatcher v2 provider STARTED evidence" in body),
              "",
          )
          values = {
              "PROVIDER_TERMINAL_EXISTS": "true" if terminal else "false",
              "PROVIDER_QUEUED_EXISTS": "true" if queued else "false",
              "PROVIDER_STARTED_EXISTS": "true" if started_body else "false",
          }
          if started_body:
              for key, pattern in {
                  "ATTEMPT": r"- attempt: `([^\`]+)`",
                  "REVISION": r"- revision: `([^\`]+)`",
                  "PROVIDER_ACTION": r"- action: `([^\`]+)`",
              }.items():
                  match = re.search(pattern, started_body)
                  if match:
                      values[key] = match.group(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Preserve queued provider or close terminal residue
        if: env.PROVIDER_TERMINAL_EXISTS == 'true' || env.PROVIDER_QUEUED_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROVIDER_TERMINAL_EXISTS" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
            echo "Provider terminal evidence already exists."
          else
            echo "Provider run identity is queued; preserve the open issue for status reconciliation."
          fi

      - name: Terminalize provider STARTED without recoverable run identity
        if: env.PROVIDER_TERMINAL_EXISTS != 'true' && env.PROVIDER_QUEUED_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="FAILED"
          blocking_action="inspect the exact provider runner failure before retry"
          if [ "$PROVIDER_STARTED_EXISTS" = "true" ]; then
            result="MANUAL_REQUIRED"
            blocking_action="inspect provider launch state before any resubmission; STARTED exists but no provider run identity was captured"
          elif [ "$SOURCE_CONCLUSION" = "cancelled" ]; then
            result="CANCELLED"
          fi
          terminal_file="$RUNNER_TEMP/provider-terminal-guard.md"
          {
            echo '## Dispatcher v2 provider completion evidence'
            echo
            printf -- '- task_id: `%s`\n' "$TASK_ID"
            if [ -n "${ATTEMPT:-}" ]; then printf -- '- attempt: `%s`\n' "$ATTEMPT"; fi
            if [ -n "${REVISION:-}" ]; then printf -- '- revision: `%s`\n' "$REVISION"; fi
            printf -- '- control_sha: `%s`\n' "$CONTROL_SHA"
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            if [ -n "${PROVIDER_ACTION:-}" ]; then printf -- '- action: `%s`\n' "$PROVIDER_ACTION"; fi
            printf -- '- runner_run_id: `%s`\n' "$SOURCE_RUN_ID"
            printf -- '- runner_conclusion: `%s`\n' "$SOURCE_CONCLUSION"
            printf -- '- result: `%s`\n' "$result"
            printf -- '- blocking_action: %s\n' "$blocking_action"
            printf -- '- runtime/device/physical: `NOT_INFERRED`\n'
          } > "$terminal_file"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$terminal_file"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
