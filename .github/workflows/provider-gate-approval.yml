name: Provider Gate Approval

run-name: Provider Gate Approval ${{ inputs.project }} ${{ inputs.gate }} ${{ inputs.source_sha }} ${{ inputs.control_sha }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered project
        required: true
        type: choice
        options:
          - WAFL
          - CLASSMO
          - ESC
          - MUVEL
      control_sha:
        description: Exact DEV-CONTROL registration SHA observed by SANJINWORKS
        required: true
        type: string
      source_sha:
        description: Exact current product source SHA being approved
        required: true
        type: string
      gate:
        description: Exact registered provider gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  wafl:
    if: ${{ inputs.project == 'WAFL' }}
    uses: ./.github/workflows/provider-gate-approval-core.yml
    with:
      project: WAFL
      product_repository: ChoiWonJae850610/WAFL
      target_branch: cloud-dev-v1
      state_path: .wonjae/execution-state.yaml
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      gate: ${{ inputs.gate }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_read_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      supabase_access_token: ${{ secrets.WAFL_SUPABASE_ACCESS_TOKEN }}
      expo_token: ${{ secrets.WAFL_EXPO_TOKEN }}

  classmo:
    if: ${{ inputs.project == 'CLASSMO' }}
    uses: ./.github/workflows/provider-gate-approval-core.yml
    with:
      project: CLASSMO
      product_repository: ChoiWonJae850610/CLASSMO
      target_branch: cloud-dev-v1
      state_path: .wonjae/execution-state.yaml
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      gate: ${{ inputs.gate }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_read_token: ${{ secrets.CLASSMO_WRITE_TOKEN }}
      supabase_access_token: ${{ secrets.CLASSMO_SUPABASE_ACCESS_TOKEN }}
      expo_token: ${{ secrets.CLASSMO_EXPO_TOKEN }}

  esc:
    if: ${{ inputs.project == 'ESC' }}
    uses: ./.github/workflows/provider-gate-approval-core.yml
    with:
      project: ESC
      product_repository: ChoiWonJae850610/ESC
      target_branch: cloud-dev-v1
      state_path: .wonjae/execution-state.yaml
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      gate: ${{ inputs.gate }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_read_token: ${{ secrets.ESC_WRITE_TOKEN }}

  muvel:
    if: ${{ inputs.project == 'MUVEL' }}
    uses: ./.github/workflows/provider-gate-approval-core.yml
    with:
      project: MUVEL
      product_repository: ChoiWonJae850610/MUVEL
      target_branch: cloud-dev-v1
      state_path: .wonjae/execution-state.yaml
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      gate: ${{ inputs.gate }}
    secrets:
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
      product_read_token: ${{ secrets.MUVEL_WRITE_TOKEN }}
