name: Reconciliation Finalizer

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  wafl:
    if: >-
      ${{
        github.event.issue.state == 'open' &&
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[RECONCILE][WAFL] ') &&
        (
          github.event_name == 'issues' ||
          (
            github.event_name == 'issue_comment' &&
            github.event.comment.user.login == github.repository_owner &&
            github.event.comment.body == '[RECONCILE-RUN]'
          )
        )
      }}
    uses: ./.github/workflows/reconciliation-finalizer-core.yml
    with:
      project: WAFL
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
    secrets:
      product_write_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}

  classmo:
