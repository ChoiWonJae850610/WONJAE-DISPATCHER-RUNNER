name: Reconciliation Finalizer

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  wafl:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[RECONCILE][WAFL] ') }}
    uses: ./.github/workflows/reconciliation-finalizer-core.yml
    with:
      project: WAFL
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
    secrets:
      product_write_token: ${{ secrets.WAFL_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}

  classmo:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[RECONCILE][CLASSMO] ') }}
    uses: ./.github/workflows/reconciliation-finalizer-core.yml
    with:
      project: CLASSMO
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
    secrets:
      product_write_token: ${{ secrets.CLASSMO_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}

  esc:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[RECONCILE][ESC] ') }}
    uses: ./.github/workflows/reconciliation-finalizer-core.yml
    with:
      project: ESC
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
    secrets:
      product_write_token: ${{ secrets.ESC_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}

  muvel:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[RECONCILE][MUVEL] ') }}
    uses: ./.github/workflows/reconciliation-finalizer-core.yml
    with:
      project: MUVEL
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body }}
    secrets:
      product_write_token: ${{ secrets.MUVEL_WRITE_TOKEN }}
      control_read_token: ${{ secrets.CONTROL_READ_TOKEN }}
