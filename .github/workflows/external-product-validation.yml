name: External Product Validation
run-name: ${{ github.event_name == 'issues' && github.event.issue.title || format('External Product Validation {0} {1}', inputs.project, inputs.source_sha) }}

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      project:
        description: Registered product
        required: true
        type: choice
        options:
          - WAFL
          - CLASSMO
          - ESC
          - MUVEL
      source_sha:
        description: Exact product commit SHA
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: external-validation-${{ github.event.issue.title || format('{0}-{1}', inputs.project, inputs.source_sha) }}
  cancel-in-progress: false

jobs:
  wafl:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.project == 'WAFL') ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          startsWith(github.event.issue.title, '[EXTERNAL-VALIDATE][WAFL] ')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Resolve exact request
        id: claim
        shell: pwsh
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          if ("$env:GITHUB_EVENT_NAME" -eq "issues") {
            if ($env:ISSUE_TITLE -notmatch '^\[EXTERNAL-VALIDATE\]\[WAFL\] ([0-9a-f]{40})$') {
              throw "Invalid WAFL external-validation issue title."
            }
            $sha = $Matches[1]
          } else {
            $sha = $env:INPUT_SHA
            if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid source SHA." }
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact WAFL source
        uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/WAFL
          ref: ${{ steps.claim.outputs.sha }}
          token: ${{ secrets.WAFL_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git -C product rev-parse HEAD).Trim()
          if ($actual -ne "${{ steps.claim.outputs.sha }}") { throw "WAFL exact checkout mismatch: $actual" }

      - name: Set up validated static Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            product/package-lock.json
            product/apps/mobile/package-lock.json

      - name: Bind canonical static Node authority
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          "WAFL_STATIC_NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $nodePath --version
          npm --version

      - name: Install root dependencies
        shell: pwsh
        run: npm ci --prefix product

      - name: Install mobile dependencies
        shell: pwsh
        run: npm ci --prefix product/apps/mobile

      - name: Install pinned Playwright Chromium
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\product\node_modules\.bin\playwright.cmd" install chromium'

      - name: Set up retained external-QA contract Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      - name: Verify dual Node authority
        shell: pwsh
        run: |
          $staticVersion = (& $env:WAFL_STATIC_NODE_PATH --version).Trim()
          $runtimeContractVersion = (node --version).Trim()
          if ($staticVersion -ne "v24.19.0") { throw "STATIC_NODE_AUTHORITY_MISMATCH: $staticVersion" }
          if ($runtimeContractVersion -ne "v24.14.0") { throw "EXTERNAL_QA_NODE_CONTRACT_MISMATCH: $runtimeContractVersion" }

      - name: Canonical offline/static verification
        shell: pwsh
        working-directory: product
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\pipeline\verify-safe.ps1 -Profile automation-infrastructure

      - name: Verify repository postcondition
        shell: pwsh
        working-directory: product
        run: |
          $trackedDelta = git status --porcelain --untracked-files=no
          if ($trackedDelta) {
            Write-Error "Tracked repository state changed during external validation:`n$trackedDelta"
            exit 1
          }
          if ((git rev-parse HEAD).Trim() -ne "${{ steps.claim.outputs.sha }}") { throw "WAFL HEAD moved during validation." }

      - name: Record PASS
        if: ${{ success() && github.event_name == 'issues' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @"
          ## External validation evidence
          - project: `WAFL`
          - source_sha: `${{ steps.claim.outputs.sha }}`
          - result: `PASS`
          - runner_run_id: `$env:GITHUB_RUN_ID`
          - canonical_product_workflow: `NOT_SUBSTITUTED`
          - fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`

          This public-runner result is exact-SHA static evidence only. It does not claim a successful WAFL repository Actions run or any provider/runtime/device PASS.
          "@
          $body | Set-Content -LiteralPath "$env:RUNNER_TEMP\external-validation.md" -Encoding utf8
          gh issue comment "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --body-file "$env:RUNNER_TEMP\external-validation.md"
          gh issue close "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --reason completed

      - name: Record failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @"
          ## External validation evidence
          - project: `WAFL`
          - source_sha: `${{ steps.claim.outputs.sha }}`
          - result: `FAILED`
          - runner_run_id: `$env:GITHUB_RUN_ID`
          - canonical_product_workflow: `NOT_SUBSTITUTED`
          - fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`
          "@
          $body | Set-Content -LiteralPath "$env:RUNNER_TEMP\external-validation.md" -Encoding utf8
          gh issue comment "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --body-file "$env:RUNNER_TEMP\external-validation.md"

  classmo:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.project == 'CLASSMO') ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          startsWith(github.event.issue.title, '[EXTERNAL-VALIDATE][CLASSMO] ')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact request
        id: claim
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            [[ "$ISSUE_TITLE" =~ ^\[EXTERNAL-VALIDATE\]\[CLASSMO\]\ ([0-9a-f]{40})$ ]] || { echo "::error::Invalid CLASSMO validation title."; exit 1; }
            sha="${BASH_REMATCH[1]}"
          else
            sha="$INPUT_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid source SHA."; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/CLASSMO
          ref: ${{ steps.claim.outputs.sha }}
          token: ${{ secrets.CLASSMO_WRITE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Validate exact CLASSMO source
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ steps.claim.outputs.sha }}"
          npm ci --prefix product
          npm run validate --prefix product
          test -z "$(git -C product status --porcelain --untracked-files=no)"
          test "$(git -C product rev-parse HEAD)" = "${{ steps.claim.outputs.sha }}"

      - name: Record PASS
        if: ${{ success() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body $'## External validation evidence\n- project: `CLASSMO`\n- source_sha: `${{ steps.claim.outputs.sha }}`\n- result: `PASS`\n- runner_run_id: `'$GITHUB_RUN_ID$'`\n- canonical_product_workflow: `NOT_SUBSTITUTED`'\n- fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`'
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record failure
        if: ${{ failure() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body $'## External validation evidence\n- project: `CLASSMO`\n- source_sha: `${{ steps.claim.outputs.sha }}`\n- result: `FAILED`\n- runner_run_id: `'$GITHUB_RUN_ID$'`'

  esc:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.project == 'ESC') ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          startsWith(github.event.issue.title, '[EXTERNAL-VALIDATE][ESC] ')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Resolve exact request
        id: claim
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            [[ "$ISSUE_TITLE" =~ ^\[EXTERNAL-VALIDATE\]\[ESC\]\ ([0-9a-f]{40})$ ]] || { echo "::error::Invalid ESC validation title."; exit 1; }
            sha="${BASH_REMATCH[1]}"
          else
            sha="$INPUT_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid source SHA."; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/ESC
          ref: ${{ steps.claim.outputs.sha }}
          token: ${{ secrets.ESC_WRITE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate protocol
        working-directory: product/packages/protocol
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Validate realtime
        working-directory: product/services/realtime
        env:
          ESC_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run runtime:dry-run

      - name: Validate mobile
        working-directory: product/apps/mobile
        run: |
          npm install --no-audit --no-fund
          npx expo config --type public >/dev/null
          npm run typecheck
          npm run lint
          npm test
          export_dir="$(mktemp -d "${RUNNER_TEMP}/esc-ios-export.XXXXXX")"
          trap 'rm -rf "$export_dir"' EXIT
          npx --no-install expo export --platform ios --output-dir "$export_dir"

      - name: Verify exact postcondition
        run: |
          test -z "$(git -C product status --porcelain --untracked-files=no)"
          test "$(git -C product rev-parse HEAD)" = "${{ steps.claim.outputs.sha }}"

      - name: Record PASS
        if: ${{ success() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body $'## External validation evidence\n- project: `ESC`\n- source_sha: `${{ steps.claim.outputs.sha }}`\n- result: `PASS`\n- runner_run_id: `'$GITHUB_RUN_ID$'`\n- canonical_product_workflow: `NOT_SUBSTITUTED`'\n- fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`'
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record failure
        if: ${{ failure() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body $'## External validation evidence\n- project: `ESC`\n- source_sha: `${{ steps.claim.outputs.sha }}`\n- result: `FAILED`\n- runner_run_id: `'$GITHUB_RUN_ID$'`'

  muvel:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.project == 'MUVEL') ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          startsWith(github.event.issue.title, '[EXTERNAL-VALIDATE][MUVEL] ')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Resolve exact request
        id: claim
        shell: pwsh
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          if ("$env:GITHUB_EVENT_NAME" -eq "issues") {
            if ($env:ISSUE_TITLE -notmatch '^\[EXTERNAL-VALIDATE\]\[MUVEL\] ([0-9a-f]{40})$') { throw "Invalid MUVEL validation title." }
            $sha = $Matches[1]
          } else {
            $sha = $env:INPUT_SHA
            if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid source SHA." }
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v6
        with:
          repository: ChoiWonJae850610/MUVEL
          ref: ${{ steps.claim.outputs.sha }}
          token: ${{ secrets.MUVEL_WRITE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        working-directory: product
        run: |
          dotnet restore .\MUVEL.sln
          dotnet build .\MUVEL.sln --configuration Debug --no-restore
          dotnet run --project .\tests\MUVEL.Domain.Tests\MUVEL.Domain.Tests.csproj --configuration Debug --no-build --
          dotnet run --project .\tests\MUVEL.VisualSnapshots\MUVEL.VisualSnapshots.csproj --configuration Debug -- "$env:RUNNER_TEMP\muvel-visual-snapshots"

      - name: Install Godot 4.7.2 .NET and Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "godot-4.7.2"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $godotZip = Join-Path $root "godot.zip"
          curl.exe -L --fail --retry 3 -o $godotZip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip"
          Expand-Archive -LiteralPath $godotZip -DestinationPath (Join-Path $root "editor") -Force
          $godotExe = Get-ChildItem -Path (Join-Path $root "editor") -Filter "Godot_v4.7.2-stable_mono_win64_console.exe" -Recurse | Select-Object -First 1
          if ($null -eq $godotExe) { throw "Godot console executable not found." }
          $templateTpz = Join-Path $root "templates.tpz"
          $templateZip = Join-Path $root "templates.zip"
          curl.exe -L --fail --retry 3 -o $templateTpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz"
          Copy-Item -LiteralPath $templateTpz -Destination $templateZip -Force
          Expand-Archive -LiteralPath $templateZip -DestinationPath (Join-Path $root "templates-extracted") -Force
          $templateSource = Join-Path $root "templates-extracted\templates"
          $templateTarget = Join-Path $env:APPDATA "Godot\export_templates\4.7.2.stable.mono"
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $templateSource "*") -Destination $templateTarget -Recurse -Force
          "GODOT_EXE=$($godotExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cloud Godot / Windows verification
        shell: pwsh
        working-directory: product
        run: .\tools\verify-cloud.ps1 -GodotExecutable "$env:GODOT_EXE" -ArtifactStageDirectory "$env:RUNNER_TEMP\muvel-windows-debug"

      - name: Verify Windows artifact
        shell: pwsh
        working-directory: product
        run: .\tools\verify-windows-artifact.ps1 -ArtifactDirectory "$env:RUNNER_TEMP\muvel-windows-debug"

      - name: Verify exact postcondition
        shell: pwsh
        run: |
          if ((git -C product status --porcelain --untracked-files=no)) { throw "MUVEL tracked source changed during validation." }
          if ((git -C product rev-parse HEAD).Trim() -ne "${{ steps.claim.outputs.sha }}") { throw "MUVEL HEAD moved during validation." }

      - name: Record PASS
        if: ${{ success() && github.event_name == 'issues' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @"
          ## External validation evidence
          - project: `MUVEL`
          - source_sha: `${{ steps.claim.outputs.sha }}`
          - result: `PASS`
          - runner_run_id: `$env:GITHUB_RUN_ID`
          - canonical_product_workflow: `NOT_SUBSTITUTED`
          - fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`
          "@
          $body | Set-Content -LiteralPath "$env:RUNNER_TEMP\external-validation.md" -Encoding utf8
          gh issue comment "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --body-file "$env:RUNNER_TEMP\external-validation.md"
          gh issue close "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --reason completed

      - name: Record failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @"
          ## External validation evidence
          - project: `MUVEL`
          - source_sha: `${{ steps.claim.outputs.sha }}`
          - result: `FAILED`
          - runner_run_id: `$env:GITHUB_RUN_ID`
          - canonical_product_workflow: `NOT_SUBSTITUTED`
          - fallback_scope: `RUNNER_ALLOCATION_FAILURE_ONLY`
          "@
          $body | Set-Content -LiteralPath "$env:RUNNER_TEMP\external-validation.md" -Encoding utf8
          gh issue comment "${{ github.event.issue.number }}" --repo "$env:GITHUB_REPOSITORY" --body-file "$env:RUNNER_TEMP\external-validation.md"
